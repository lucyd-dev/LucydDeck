<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LucydDeck</title>
        <script>
            // Apply the last resolved theme before the first paint. The
            // authoritative value still comes from settings:get over IPC; this
            // cache only prevents a flash while that round trip completes.
            try {
                const theme = localStorage.getItem("lucyd.theme");
                if (theme === "dark" || theme === "light") {
                    document.documentElement.dataset.theme = theme;
                } else {
                    document.documentElement.dataset.theme = window.matchMedia(
                        "(prefers-color-scheme: dark)",
                    ).matches
                        ? "dark"
                        : "light";
                }
                const accent = localStorage.getItem("lucyd.accent");
                if (accent) {
                    document.documentElement.dataset.accent = accent;
                }
            } catch {
                // localStorage can be unavailable; settings:get still applies.
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
