name: Commitlint

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    commitlint:
        name: Lint PR Commits
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint commit messages
              run: npx commitlint --config config/commitlintrc.json --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
