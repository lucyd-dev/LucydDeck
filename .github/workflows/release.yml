name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  config-file: config/release-please-config.json
                  manifest-file: config/release-please-manifest.json

    build-artifacts:
        name: Build & Upload (${{ matrix.name }})
        needs: release-please
        if: ${{ needs.release-please.outputs.tag_name != '' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux
                      os: ubuntu-latest
                      args: --linux
                    - name: windows
                      os: windows-latest
                      args: --win
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: npm

            - name: Cache electron-builder
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron-builder
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-electron-builder-

            - name: Install native build toolchain (Windows)
              if: runner.os == 'Windows'
              run: choco install -y visualstudio2022-workloadtools

            - name: Install native build dependencies (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y build-essential python3 libarchive-tools rpm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Package
              run: npx electron-builder --config config/electron-builder.json ${{ matrix.args }}

            - name: Upload release artifacts
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ needs.release-please.outputs.tag_name }}"
                  if [ -z "$TAG" ]; then
                    echo "Error: got no tag name from release-please."
                    exit 1
                  fi
                  gh release upload "$TAG" release/*/*.{AppImage,deb,exe} --clobber
