name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-typecheck:
        name: Lint & Typecheck
        # A release-please commit is built and published by the release workflow,
        # so building it again here only duplicates that work.
        if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Reject prototypes on main
              run: |
                  if [ -n "$(git ls-files prototype)" ]; then
                      echo "Prototype files belong on a prototype/<name> branch, not main."
                      git ls-files prototype
                      exit 1
                  fi

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm run test

    build-artifacts:
        name: Build & Upload (${{ matrix.name }})
        if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux
                      os: ubuntu-latest
                      args: --linux
                    - name: windows
                      os: windows-latest
                      args: --win
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: npm

            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/AppData/Local/electron
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-electron-

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y build-essential git pkg-config libudev-dev libusb-1.0-0 libusb-1.0-0-dev

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Package
              run: npx electron-builder --config config/electron-builder.json ${{ matrix.args }} --publish never

            - name: Verify serialport native module in the AppImage
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  set -euo pipefail
                  appimage=$(find release -name '*.AppImage' -print -quit)
                  if [ -z "$appimage" ]; then
                      echo "No AppImage under release/."
                      exit 1
                  fi
                  appimage=$(realpath "$appimage")
                  chmod +x "$appimage"
                  work=$(mktemp -d)
                  (cd "$work" && "$appimage" --appimage-extract >/dev/null)
                  native=$(find "$work/squashfs-root" -path '*@serialport*' -name '*.node' -print -quit)
                  if [ -z "$native" ]; then
                      echo "serialport's native .node is missing from the AppImage."
                      exit 1
                  fi
                  echo "Found $native in the AppImage"

            - name: Verify serialport native module in the NSIS installer
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $installer = Get-ChildItem -Path release -Recurse -Filter '*Setup.exe' | Select-Object -First 1
                  if (-not $installer) { throw 'No NSIS installer under release/.' }
                  $installDir = Join-Path $env:RUNNER_TEMP 'lucyddeck-install'
                  $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
                  if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
                  $native = Get-ChildItem -Path $installDir -Recurse -Filter '*.node' |
                      Where-Object { $_.FullName -like '*@serialport*' } |
                      Select-Object -First 1
                  if (-not $native) { throw "serialport's native .node is missing from the installed app." }
                  Write-Host "Found $($native.FullName) in the NSIS install"

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ runner.os }}
                  path: release/**
                  if-no-files-found: warn
