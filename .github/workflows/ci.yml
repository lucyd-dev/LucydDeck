name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-typecheck:
        name: Lint & Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

    build-artifacts:
        name: Build & Upload (${{ matrix.name }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux
                      os: ubuntu-latest
                      args: --linux
                    - name: windows
                      os: windows-latest
                      args: --win
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".node-version"
                  cache: npm

            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/AppData/Local/electron
                  key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-electron-

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev build-essential python3 libarchive-tools rpm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Package
              run: npx electron-builder --config config/electron-builder.json ${{ matrix.args }} --publish never

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ runner.os }}
                  path: release/**
                  if-no-files-found: warn
