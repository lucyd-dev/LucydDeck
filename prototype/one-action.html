                        </div>

                        ${renderActionSection()}
                        ${renderAddDock()}
                        ${panelFooter()}
                        ${state.iconModalOpen ? renderIconModal() : ""}
                    </div>`;
            }

            function allPngIcons() {
                return [
                    ...state.customIcons,
                    ...PNG_ICONS.map((item) => ({ ...item, url: `icons/${item.name}.png` })),
                ];
            }

            function pngIconTile(item) {
                const active = currentKey().icon === item.name;
                return `<button
                    class="icon-tile ${active ? "icon-tile--active" : ""}"
                    data-act="pick-icon"
                    data-icon-name="${escapeHtml(item.name)}"
                    title="${escapeHtml(item.label)}"
                >
                    <img src="${item.url}" alt="${escapeHtml(item.label)}" />
                </button>`;
            }

            function renderIconPicker() {
                const recent = allPngIcons().slice(0, 8);
                return `<div class="icon-pop">
                    <div class="icon-pop__head">
                        <span>Icons</span>
                        <button data-act="icon-browse">Browse all</button>
                    </div>
                    <div class="icon-pop__grid">${recent.map(pngIconTile).join("")}</div>
                </div>`;
            }

            function renderIconModal() {
                return `<div class="icon-modal">
                    <div class="icon-modal__dialog" role="dialog" aria-label="Icon library">
                        <div class="icon-modal__head">
                            <h3>Icons</h3>
                            <button class="icon-modal__close" data-act="modal-close" title="Close">${icon("x", 14)}</button>
                        </div>
                        <div class="icon-modal__grid">
                            ${allPngIcons().map(pngIconTile).join("")}
                        </div>
                        <div class="icon-modal__foot">
                            <label class="icon-import">
                                ${icon("plus", 12)}
                                <span>Import PNG</span>
                                <input type="file" accept="image/png" data-role="icon-upload" />
                            </label>
                            <span class="icon-modal__hint">PNG · 140×140</span>
                            <button class="button" data-act="modal-close">Done</button>
                        </div>
                    </div>
                </div>`;
            }

            function filteredActions() {
                const search = state.search.trim().toLowerCase();
                return ACTIONS.filter((action) => {
                    const inCategory = state.category === "all" || action.cat === state.category;
                    const matches =
                        search === "" ||
                        `${action.label} ${action.hint} ${action.id}`
                            .toLowerCase()
                            .includes(search);
                    return inCategory && matches;
                });
            }

            function categoryChips() {
                const entries = [{ id: "all", label: "All" }, ...CATEGORIES];
                return `<div class="category-chips">${entries
                    .map(
                        (cat) =>
                            `<button class="category-chip ${state.category === cat.id ? "category-chip--active" : ""}" data-act="cat" data-cat="${cat.id}">${escapeHtml(cat.label)}</button>`,
                    )
                    .join("")}</div>`;
            }

            function actionRows(actions, options = {}) {
                if (actions.length === 0) {
                    return `<p class="empty">No actions match.</p>`;
                }
                return `<div class="action-list">${actions
                    .map((action) => {
                        const cat = categoryOf(action.cat);
                        return `<button class="action-row ${state.picked === action.id ? "action-row--active" : ""}" data-act="pick" data-action-id="${action.id}">
                            <span class="cat-icon cat-icon--${action.cat}">${icon(cat.icon, 14)}</span>
                            <span class="action-row__body">
                                <span class="action-row__label">${escapeHtml(action.label)}</span>
                                <span class="action-row__meta">${escapeHtml(options.showCategory ? cat.label : action.hint)}</span>
                            </span>
                        </button>`;
                    })
                    .join("")}</div>`;
            }

            function draftMarkup(options = {}) {
                const type = ACTIONS.find((action) => action.id === state.picked);
                if (!type) {
                    return "";
                }
                const cat = categoryOf(type.cat);
                const fields = type.fields.length
                    ? `<div class="draft__fields">${type.fields
                          .map((field) => {
                              const value = state.values[field.key] ?? "";
                              let control;
                              if (field.kind === "select") {
                                  control = `<select class="select" data-role="add-field" data-key="${field.key}">
                                      ${field.options
                                          .map(
                                              (option) =>
                                                  `<option value="${escapeHtml(option.value)}" ${option.value === value ? "selected" : ""}>${escapeHtml(option.label)}</option>`,
                                          )
                                          .join("")}
                                  </select>`;
                              } else if (field.kind === "textarea") {
                                  control = `<textarea class="input" rows="2" data-role="add-field" data-key="${field.key}">${escapeHtml(value)}</textarea>`;
                              } else {
                                  control = `<input class="input" type="${field.kind === "number" ? "number" : "text"}" value="${escapeHtml(value)}" data-role="add-field" data-key="${field.key}" placeholder="${escapeHtml(field.placeholder ?? "")}" />`;
                              }
                              return `<label class="field ${field.wide ? "field--wide" : ""}"><span class="field__label">${escapeHtml(field.label)}</span>${control}</label>`;
                          })
                          .join("")}</div>`
                    : `<p class="field__label" style="margin:0">This step takes no options.</p>`;
                return `<div class="draft">
                    <div class="draft__summary">
                        <span class="cat-icon cat-icon--${type.cat}">${icon(cat.icon, 14)}</span>
                        <span class="draft__summary-text">${escapeHtml(type.label)}</span>
                        <button class="draft__change" data-act="add-cancel">Change</button>
                    </div>
                    ${fields}
                    <div class="draft__actions">
                        <button class="button button--primary" data-act="add-submit" ${!canAdd(type) ? "disabled" : ""}>${icon("plus", 12)} Add step</button>
                        <button class="button" data-act="add-cancel">Cancel</button>
                    </div>
                </div>`;
            }

            function canAdd(type) {
                if (type.raw || type.id === "TEXT") {
                    return true;
                }
                return !type.fields.some(
                    (field) =>
                        !field.optional && String(state.values[field.key] ?? "").trim() === "",
                );
            }

            function providerMeta(id) {
                return PROVIDERS.find((provider) => provider.id === id) ?? PROVIDERS[0];
            }

            function providerCount(id) {
                return actionsFor(id).length;
            }

            function providerHint(id) {
                return (
                    {
                        deck: "Pages and profiles",
                        system: "Keyboard, mouse, text and timing",
                        discord: "Voice controls",
                        obs: "Recording and camera",
                        spotify: "Playback controls",
                        other: "Installed plugins without a group",
                    }[id] ?? ""
                );
            }

            function providerRow(provider, options = {}) {
                const count = providerCount(provider.id);
                const active = state.provider === provider.id && options.forceActive !== true;
                return `<button
                    class="provider-row ${active ? "provider-row--active" : ""} ${count === 0 ? "provider-row--empty" : ""}"
                    data-act="provider"
                    data-provider="${provider.id}"
                >
                    <span class="provider-row__icon">${icon(provider.icon, 13)}</span>
                    <span class="provider-row__label">${escapeHtml(provider.label)}</span>
                    <span class="provider-row__count">${count === 0 ? "—" : count}</span>
                </button>`;
            }

            function addActionRows(actions, options = {}) {
                if (actions.length === 0) {
                    return `<p class="add-pane__empty">No actions here yet. Install plugins in Settings to add more providers.</p>`;
                }
                return `<div class="add-actions">${actions
                    .map((action) => {
                        const active = state.picked === action.id;
                        return `<button class="add-action ${active ? "add-action--active" : ""}" data-act="pick" data-action-id="${action.id}">
                            <span class="add-action__body">
                                <span class="add-action__label">${escapeHtml(action.label)}</span>
                                <span class="add-action__hint">${escapeHtml(options.hideHint ? "" : action.hint)}</span>
                            </span>
                            <span class="add-action__plus">${icon(active ? "check" : "plus", 11)}</span>
                        </button>`;
                    })
                    .join("")}</div>`;
            }

            function addFieldsMarkup(type, options = {}) {
                if (type.fields.length === 0) {
                    return `<p class="config__empty">No options. It runs as soon as the key is pressed.</p>`;
                }
                return `<div class="config__fields ${options.singleColumn ? "config__fields--single" : ""}">${type.fields
                    .map((field) => {
                        const value = state.values[field.key] ?? "";
                        let control;
                        if (field.kind === "select") {
                            control = `<select class="select" data-role="add-field" data-key="${field.key}">
                                ${field.options
                                    .map(
                                        (option) =>
                                            `<option value="${escapeHtml(option.value)}" ${option.value === value ? "selected" : ""}>${escapeHtml(option.label)}</option>`,
                                    )
                                    .join("")}
                            </select>`;
                        } else if (field.kind === "textarea") {
                            control = `<textarea class="input" rows="2" data-role="add-field" data-key="${field.key}">${escapeHtml(value)}</textarea>`;
                        } else {
                            control = `<input class="input" type="${field.kind === "number" ? "number" : "text"}" value="${escapeHtml(value)}" data-role="add-field" data-key="${field.key}" placeholder="${escapeHtml(field.placeholder ?? "")}" />`;
                        }
                        return `<label class="field ${field.wide ? "field--wide" : ""}"><span class="field__label">${escapeHtml(field.label)}</span>${control}</label>`;
                    })
                    .join("")}</div>`;
            }

            function addConfig(type, options = {}) {
                const provider = providerMeta(providerOfAction(type));
                const cat = categoryOf(type.cat);
                return `<div class="config ${options.className ?? ""}">
                    ${
                        options.showHead === false
                            ? ""
                            : `<div class="config__head">
                                ${
                                    options.showBack
                                        ? `<button class="config__back" data-act="add-back" title="Back to actions">${icon("chevron-left", 13)}</button>`
                                        : `<span class="cat-icon cat-icon--${type.cat}">${icon(cat.icon, 13)}</span>`
                                }
                                <span class="config__title">
                                    <strong>${escapeHtml(type.label)}</strong>
                                    <span>${escapeHtml(provider.label)}</span>
                                </span>
                            </div>`
                    }
                    <div class="config__scroll">${addFieldsMarkup(type, options)}</div>
                    <div class="config__foot">
                        ${
                            options.showCancel === false
                                ? ""
                                : `<button class="config__cancel" data-act="add-cancel">Cancel</button>`
                        }
                        <button class="add-submit" data-act="add-submit" ${!canAdd(type) ? "disabled" : ""}>
                            ${icon("plus", 11)}
                            <span>${submitLabel()}</span>
                        </button>
                    </div>
                </div>`;
            }

            function renderAppendBanner() {
                const first = currentKey().steps[0];
                const label = first ? describe(first).label : "";
                return `<div class="append-banner">
                    ${icon("corner-down-left", 12)}
                    <span>Adding after “${escapeHtml(label)}”</span>
                    <button data-act="append-cancel" title="Cancel adding a step">${icon("x", 12)}</button>
                </div>`;
            }

            function renderAddDock() {
                const body = state.addOpen ? renderAddSplit() : "";
                const banner = state.addOpen && state.appendAfter ? renderAppendBanner() : "";
                return `<section class="add-dock ${state.addOpen ? "add-dock--open" : ""}">
                    <button
                        class="add-dock__head"
                        data-act="add-toggle"
                        aria-expanded="${state.addOpen}"
                        title="${state.addOpen ? "Collapse Add Action" : "Expand Add Action"}"
                    >
                        <span class="add-dock__mark">${icon("plus", 12)}</span>
                        <span class="add-dock__title">Add Action</span>
                        <span class="add-dock__chev">${icon(state.addOpen ? "chevron-down" : "chevron-up", 14)}</span>
                    </button>
                    ${state.addOpen ? `<div class="add-dock__body">${banner}${body}</div>` : ""}
                </section>`;
            }

            function renderAddSplit() {
                const provider = providerMeta(state.provider);
                const type = ACTIONS.find((action) => action.id === state.picked);
                const count = providerCount(provider.id);
                if (type) {
                    return `<div class="add-focus">
                        <div class="add-focus__crumbs">
                            <button class="add-focus__back" data-act="add-cancel">
                                ${icon("chevron-left", 12)}
                                <span>Back</span>
                            </button>
                            <span class="add-focus__path">${escapeHtml(provider.label)} / ${escapeHtml(type.label)}</span>
                        </div>
                        <div class="add-focus__body">
                            ${addFieldsMarkup(type)}
                        </div>
                        <div class="add-focus__foot">
                            <button class="add-submit" data-act="add-submit" ${!canAdd(type) ? "disabled" : ""}>
                                ${icon("plus", 11)}
                                <span>${submitLabel()}</span>
                            </button>
                        </div>
                    </div>`;
                }
                return `<div class="add-split">
                    <nav class="provider-menu" aria-label="Action providers">
                        ${PROVIDERS.map((item) => providerRow(item)).join("")}
                    </nav>
                    <div class="add-pane">
                        <div class="add-pane__head">
                            <span>${escapeHtml(provider.label)}</span>
                            <span>${count} ${count === 1 ? "action" : "actions"}</span>
                        </div>
                        <div class="add-pane__scroll">
                            ${addActionRows(actionsFor(provider.id))}
                        </div>
                    </div>
                </div>`;
            }

            function renderAddStacked() {
                const type = ACTIONS.find((action) => action.id === state.picked);
                return `<div class="add-stack">
                    <div class="add-stack__scroll">
                        ${PROVIDERS.map((provider) => {
                            const active = state.provider === provider.id;
                            return `<section class="stack-group">
                                <button class="stack-head ${active ? "stack-head--active" : ""}" data-act="provider" data-provider="${provider.id}">
                                    ${icon(active ? "chevron-down" : "chevron-right", 12)}
                                    <span class="stack-head__icon">${icon(provider.icon, 13)}</span>
                                    <span class="stack-head__label">${escapeHtml(provider.label)}</span>
                                    <span class="stack-head__count">${providerCount(provider.id)}</span>
                                </button>
                                ${
                                    active
                                        ? `<div class="stack-body">${addActionRows(actionsFor(provider.id))}</div>`
                                        : ""
                                }
                            </section>`;
                        }).join("")}
                    </div>
                    ${type ? addConfig(type, { className: "config--stacked" }) : ""}
                </div>`;
            }

            function renderAddDrill() {
                const provider = providerMeta(state.provider);
                const type = ACTIONS.find((action) => action.id === state.picked);
                if (type) {
                    return `<div class="drill">
                        <div class="drill__crumbs">
                            <button class="drill__back" data-act="add-back" title="Back to ${escapeHtml(provider.label)}">${icon("chevron-left", 13)}</button>
                            <span class="drill__crumb">${icon(provider.icon, 12)} ${escapeHtml(provider.label)}</span>
                            <span class="drill__sep">/</span>
                            <strong class="drill__current">${escapeHtml(type.label)}</strong>
                        </div>
                        ${addConfig(type, { showCancel: false, showHead: false, className: "config--drill" })}
                    </div>`;
                }
                if (state.v3Step === "actions") {
                    return `<div class="drill">
                        <div class="drill__crumbs">
                            <button class="drill__back" data-act="add-back" title="Back to providers">${icon("chevron-left", 13)}</button>
                            <span class="drill__crumb">${icon(provider.icon, 12)} ${escapeHtml(provider.label)}</span>
                            <span class="drill__hint">Choose an action</span>
                        </div>
                        <div class="drill__scroll">${addActionRows(actionsFor(provider.id))}</div>
                    </div>`;
                }
                return `<div class="drill">
                    <div class="drill__menu">
                        ${PROVIDERS.map(
                            (
                                item,
                            ) => `<button class="drill-provider" data-act="provider" data-provider="${item.id}">
                                <span class="cat-icon cat-icon--${item.id === "deck" ? "deck" : item.id === "system" ? "keyboard" : "plugins"}">${icon(item.icon, 14)}</span>
                                <span class="drill-provider__body">
                                    <span class="drill-provider__label">${escapeHtml(item.label)}</span>
                                    <span class="drill-provider__hint">${escapeHtml(providerHint(item.id))}</span>
                                </span>
                                <span class="drill-provider__count">${providerCount(item.id)}</span>
                                ${icon("chevron-right", 13)}
                            </button>`,
                        ).join("")}
                    </div>
                </div>`;
            }

            // ---- Variant B ---------------------------------------------------

            function renderB() {
                const key = currentKey();
                const total = key.steps.length;
                return `
                    <div class="panel v-b">
                        <div class="panel-scroll">
                            <div class="v-b-head">
                                <div class="v-b-key" style="${keyStyle()}">${keyPreview(20)}</div>
                                <div class="v-b-head-body">
                                    <div class="v-b-eyebrow">Key ${state.selected + 1}</div>
                                    <input class="v-b-title" data-role="label" value="${escapeHtml(key.label)}" placeholder="Unnamed key" />
                                </div>
                                <button class="v-b-clear" data-act="clear" title="Clear key">${icon("trash", 14)}</button>
                            </div>
                            <div class="v-b-toolbar">
                                <span><strong>${total}</strong> ${total === 1 ? "step" : "steps"}</span>
                                <span>Press a step to edit it</span>
                            </div>

                            ${
                                total === 0
                                    ? `<p class="empty" style="margin-top:12px">No steps yet. Add the first step below.</p>`
                                    : `<ol class="v-b-timeline">
                                        ${key.steps
                                            .map((raw, index) => {
                                                const info = describe(raw);
                                                const open = state.openStep === index;
                                                return `<li class="v-b-node ${open ? "v-b-node--open" : ""} ${info.invalid ? "v-b-node--invalid" : ""}">
                                                    <span class="v-b-node__dot">${icon(info.invalid ? "alert-triangle" : info.icon, 9)}</span>
                                                    <button class="v-b-node__button" data-act="toggle-step" data-index="${index}">
                                                        <span class="v-b-node__label">${escapeHtml(info.label)}</span>
                                                        <span class="v-b-node__detail">${escapeHtml(info.invalid ?? info.detail)}</span>
                                                    </button>
                                                    <span class="v-b-node__meta">${String(index + 1).padStart(2, "0")}</span>
                                                    ${open ? stepEditor(index, { className: "v-b-node__editor", gridClass: "v-a-step__fields" }) : ""}
                                                    ${open ? `<div class="v-b-node__controls">${rowControls(index, total)}</div>` : ""}
                                                </li>`;
                                            })
                                            .join("")}
                                    </ol>`
                            }

                            <button class="v-b-add-bar" data-act="add-open">
                                ${icon("plus", 14)}
                                <span>Add step</span>
                                <span class="v-b-add-bar__key">A</span>
                            </button>
                        </div>
                        ${panelFooter()}
                        ${state.addOpen ? renderSheetB() : ""}
                    </div>`;
            }

            function renderSheetB() {
                const actions = filteredActions();
                const groups = CATEGORIES.map((cat) => ({
                    cat,
                    actions: actions.filter((action) => action.cat === cat.id),
                })).filter((group) => group.actions.length > 0);
                return `<div class="v-b-sheet" role="dialog" aria-label="Add step">
                    <div class="v-b-sheet__head">
                        <h3 class="v-b-sheet__title">${state.picked ? "Configure step" : "Add a step"}</h3>
                        <button class="v-b-close" data-act="add-close" title="Close">${icon("x", 13)}</button>
                    </div>
                    ${
                        state.picked
                            ? draftMarkup()
                            : `<label class="v-b-search">
                                ${icon("search", 14)}
                                <input type="search" data-role="search" value="${escapeHtml(state.search)}" placeholder="Search actions…" />
                            </label>
                            ${categoryChips()}
                            <div class="v-b-results">
                                ${
                                    groups.length === 0
                                        ? `<p class="empty">No actions match.</p>`
                                        : groups
                                              .map(
                                                  (group) =>
                                                      `<p class="v-b-group">${group.cat.label}</p>${actionRows(group.actions)}`,
                                              )
                                              .join("")
                                }
                            </div>`
                    }
                    ${panelFooter()}
                </div>`;
            }

            // ---- Variant C ---------------------------------------------------

            function renderC() {
                const key = currentKey();
                const total = key.steps.length;
                return `
                    <div class="panel v-c">
                        <div class="panel-scroll">
                            <div class="v-c-head">
                                <input class="v-c-title" data-role="label" value="${escapeHtml(key.label)}" placeholder="Unnamed key" />
                                <div class="v-c-meta">
                                    <span class="color-swatch" style="${keyStyle()}" title="Background colour">
                                        <input type="color" data-role="bg" value="${key.color ?? "#262b35"}" />
                                    </span>
                                    <span>Key ${state.selected + 1}</span>
                                    <span>·</span>
                                    <span>${total} ${total === 1 ? "step" : "steps"}</span>
                                    <span style="margin-left:auto"></span>
                                    <button class="v-a-meta-button" data-act="icon-open">${icon("image", 12)} Icon</button>
                                    <button class="v-a-meta-button" data-act="clear">${icon("trash", 12)} Clear</button>
                                </div>
                            </div>
                            ${state.iconPickerOpen ? renderIconPicker() : ""}

                            ${
                                total === 0
                                    ? `<p class="empty" style="margin-top:12px">No steps yet. Add the first step below.</p>`
                                    : `<div class="v-c-list">
                                        ${key.steps
                                            .map((raw, index) => {
                                                const info = describe(raw);
                                                const parsed = fieldValuesFor(raw);
                                                const hasFields =
                                                    parsed && parsed.type.fields.length > 0;
                                                return `<article class="v-c-card ${info.invalid ? "v-c-card--invalid" : ""}">
                                                    <div class="v-c-card__head">
                                                        <span class="v-c-card__num">${index + 1}</span>
                                                        <span class="cat-icon cat-icon--${info.cat}">${icon(info.icon, 14)}</span>
                                                        <div class="v-c-card__body">
                                                            <span class="v-c-card__label">${escapeHtml(info.label)}</span>
                                                            <span class="v-c-card__detail">${escapeHtml(info.invalid ?? info.detail)}</span>
                                                        </div>
                                                        ${rowControls(index, total)}
                                                    </div>
                                                    ${
                                                        hasFields
                                                            ? `<div class="v-c-card__fields">${fieldsMarkup(parsed.type, parsed.values, index)}</div>`
                                                            : ""
                                                    }
                                                    ${info.invalid ? `<p class="invalid-note" style="margin:0 8px 8px">Raw step kept for repair: <span class="mono">${escapeHtml(raw)}</span></p>` : ""}
                                                </article>`;
                                            })
                                            .join("")}
                                    </div>`
                            }
                        </div>
                        <div class="v-c-addbar">
                            ${state.addOpen ? renderPopC() : ""}
                            <button class="add-trigger ${state.addOpen ? "add-trigger--open" : ""}" data-act="add-open">
                                ${state.addOpen ? icon("x", 13) : icon("plus", 13)}
                                <span>${state.addOpen ? "Close picker" : "Add step"}</span>
                            </button>
                        </div>
                        ${panelFooter()}
                    </div>`;
            }

            function renderPopC() {
                const search = state.search.trim().toLowerCase();
                const groups = CATEGORIES.map((cat) => ({
                    cat,
                    actions: ACTIONS.filter(
                        (action) =>
                            action.cat === cat.id &&
                            (search === "" ||
                                `${action.label} ${action.hint}`.toLowerCase().includes(search)),
                    ),
                })).filter((group) => group.actions.length > 0);
                return `<div class="v-c-pop" role="dialog" aria-label="Add step">
                    <div class="v-c-pop__head">
                        <h3 class="v-c-pop__title">${state.picked ? "Configure step" : "Add a step"}</h3>
                        <button class="v-c-pop__close" data-act="add-close" title="Close">${icon("x", 12)}</button>
                    </div>
                    ${
                        state.picked
                            ? draftMarkup()
                            : `<label class="v-c-pop__search">
                                ${icon("search", 12)}
                                <input type="search" data-role="search" value="${escapeHtml(state.search)}" placeholder="Search all actions…" />
                            </label>
                            <div class="v-c-groups">
                                ${
                                    groups.length === 0
                                        ? `<p class="empty">No actions match.</p>`
                                        : groups
                                              .map(
                                                  (group) => `<section class="v-c-group">
                                                      <h4 class="v-c-group__title">${icon(group.cat.icon, 11)} ${group.cat.label}</h4>
                                                      ${actionRows(group.actions)}
                                                  </section>`,
                                              )
                                              .join("")
                                }
                            </div>`
                    }
                </div>`;
            }

            function panelFooter() {
                return `<div class="panel-foot">
                    <span class="panel-foot__version">${icon("zap", 11)} LucydDeck v0.2.0</span>
                    <span>Prototype</span>
                </div>`;
            }

            function renderPanel() {
                panelEl.innerHTML = renderA();
            }

            function renderAll() {
                renderBoard();
                renderPanel();
            }

            // -----------------------------------------------------------------
            // Behaviour.
            // -----------------------------------------------------------------
            function submitLabel() {
                if (state.appendAfter) {
                    return "Add step";
                }
                const total = currentKey().steps.length;
                if (total > 1) {
                    return "Add step";
                }
                return total === 1 ? "Replace" : "Add";
            }

            function addStep() {
                const type = ACTIONS.find((action) => action.id === state.picked);
                if (!type) {
                    return;
                }
                const raw = buildRaw(type, state.values);
                const key = currentKey();
                if (state.appendAfter || key.steps.length > 1) {
                    key.steps.push(raw);
                } else {
                    key.steps = [raw];
                }
                state.appendAfter = false;
                state.picked = null;
                state.values = {};
                state.openStep = null;
                renderAll();
                const scroller = panelEl.querySelector(".v-a-list-scroll");
                if (scroller && key.steps.length > 1) {
                    scroller.scrollTop = scroller.scrollHeight;
                }
            }

            panelEl.addEventListener("click", (event) => {
                if (event.target.classList.contains("icon-modal")) {
                    state.iconModalOpen = false;
                    renderPanel();
                    return;
                }
                const target = event.target.closest("[data-act]");
                if (!target) {
                    return;
                }
                const act = target.dataset.act;
                const index = Number(target.dataset.index);
                const key = currentKey();

                if (act === "toggle-step") {
                    state.openStep = state.openStep === index ? null : index;
                    state.iconPickerOpen = false;
                    renderPanel();
                    return;
                }
                if (act === "move-up" || act === "move-down") {
                    const delta = act === "move-up" ? -1 : 1;
                    const targetIndex = index + delta;
                    if (targetIndex >= 0 && targetIndex < key.steps.length) {
                        [key.steps[index], key.steps[targetIndex]] = [
                            key.steps[targetIndex],
                            key.steps[index],
                        ];
                        state.openStep = targetIndex;
                        renderAll();
                    }
                    return;
                }
                if (act === "remove") {
                    key.steps.splice(index, 1);
                    state.openStep = null;
                    renderAll();
                    return;
                }
                if (act === "clear") {
                    key.steps = [];
                    key.label = "";
                    key.icon = null;
                    key.color = null;
                    state.openStep = null;
                    state.appendAfter = false;
                    state.iconPickerOpen = false;
                    state.iconModalOpen = false;
                    renderAll();
                    return;
                }
                if (act === "icon-open") {
                    state.iconPickerOpen = !state.iconPickerOpen;
                    state.iconModalOpen = false;
                    renderPanel();
                    return;
                }
                if (act === "icon-browse") {
                    state.iconPickerOpen = false;
                    state.iconModalOpen = true;
                    renderPanel();
                    return;
                }
                if (act === "modal-close") {
                    state.iconModalOpen = false;
                    renderPanel();
                    return;
                }
                if (act === "pick-icon") {
                    key.icon = target.dataset.iconName;
                    state.iconPickerOpen = false;
                    state.iconModalOpen = false;
                    renderAll();
                    return;
                }
                if (act === "append-mode") {
                    state.appendAfter = true;
                    state.addOpen = true;
                    state.picked = null;
                    state.values = {};
                    renderPanel();
                    return;
                }
                if (act === "append-cancel") {
                    state.appendAfter = false;
                    state.picked = null;
                    state.values = {};
                    renderPanel();
                    return;
                }
                if (act === "add-toggle") {
                    state.addOpen = !state.addOpen;
                    renderPanel();
                    return;
                }
                if (act === "provider") {
                    state.provider = target.dataset.provider;
                    state.picked = null;
                    state.values = {};
                    renderPanel();
                    return;
                }
                if (act === "pick") {
                    const type = ACTIONS.find((action) => action.id === target.dataset.actionId);
                    if (!type) {
                        return;
                    }
                    state.picked = type.id;
                    state.provider = providerOfAction(type);
                    state.values = defaultValues(type);
                    renderPanel();
                    const field = panelEl.querySelector("[data-role=add-field]");
                    if (field) {
                        field.focus();
                    }
                    return;
                }
                if (act === "add-cancel") {
                    state.picked = null;
                    state.values = {};
                    renderPanel();
                    return;
                }
                if (act === "add-back") {
                    state.picked = null;
                    state.values = {};
                    renderPanel();
                    return;
                }
                if (act === "add-submit") {
                    addStep();
                }
            });

            panelEl.addEventListener("change", (event) => {
                const target = event.target;
                const role = target.dataset.role;
                if (role === "icon-upload") {
                    const file = target.files?.[0];
                    if (!file) {
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () => {
                        const name = `custom-${Date.now()}`;
                        state.customIcons.push({
                            name,
                            label: file.name,
                            url: String(reader.result),
                        });
                        currentKey().icon = name;
                        state.iconModalOpen = false;
                        state.iconPickerOpen = false;
                        renderAll();
                    };
                    reader.readAsDataURL(file);
                    return;
                }
                if (role === "step-field") {
                    const index = Number(target.dataset.step);
                    const raw = currentKey().steps[index];
                    const parsed = fieldValuesFor(raw);
                    if (!parsed) {
                        return;
                    }
                    parsed.values[target.dataset.key] = target.value;
                    currentKey().steps[index] = buildRaw(parsed.type, parsed.values);
                    renderAll();
                    return;
                }
                if (role === "step-raw") {
                    const index = Number(target.dataset.step);
                    currentKey().steps[index] = target.value;
                    renderAll();
                    return;
                }
                if (role === "add-field") {
                    state.values[target.dataset.key] = target.value;
                    return;
                }
            });

            panelEl.addEventListener("input", (event) => {
                const target = event.target;
                const role = target.dataset.role;
                if (role === "label") {
                    currentKey().label = target.value;
                    renderBoard();
                    return;
                }
                if (role === "bg") {
                    currentKey().color = target.value;
                    renderBoard();
                    const preview = panelEl.querySelector(".v-a-preview");
                    if (preview) {
                        preview.style.setProperty("--key-bg", target.value);
                    }
                    const swatch = panelEl.querySelector(".appearance-swatch");
                    if (swatch) {
                        swatch.style.backgroundColor = target.value;
                    }
                    return;
                }
                if (role === "add-field") {
                    state.values[target.dataset.key] = target.value;
                    return;
                }
                if (role === "search") {
                    state.search = target.value;
                    state.picked = null;
                    renderPanel();
                    const field = panelEl.querySelector("[data-role=search]");
                    if (field) {
                        field.focus();
                        const end = field.value.length;
                        field.setSelectionRange?.(end, end);
                    }
                }
            });

            boardEl.addEventListener("click", (event) => {
                const button = event.target.closest("[data-key]");
                if (!button) {
                    return;
                }
                state.selected = Number(button.dataset.key);
                state.openStep = null;
                state.picked = null;
                state.values = {};
                state.appendAfter = false;
                state.iconPickerOpen = false;
                state.iconModalOpen = false;
                renderAll();
            });

            document.addEventListener("keydown", (event) => {
                if (event.key !== "Escape") {
                    return;
                }
                if (state.iconModalOpen || state.iconPickerOpen) {
                    state.iconModalOpen = false;
                    state.iconPickerOpen = false;
                    renderPanel();
                }
            });

            const params = new URLSearchParams(window.location.search);

            // Handy deep links for review: ?provider=discord&pick=PLUGIN_DISCORD_MUTE
            // selects a menu entry and an action; ?step=0 opens an action.
            if (params.get("step") !== null) {
                const step = Number(params.get("step"));
                if (Number.isInteger(step) && step >= 0) {
                    state.openStep = step;
                }
            }
            if (params.get("provider") !== null) {
                const provider = params.get("provider");
                if (PROVIDERS.some((item) => item.id === provider)) {
                    state.provider = provider;
                }
            }
            if (params.get("key") !== null) {
                const keyIndex = Number(params.get("key"));
                if (Number.isInteger(keyIndex) && keyIndex >= 0 && keyIndex < keys.length) {
                    state.selected = keyIndex;
                }
            }
            if (params.get("icons") === "pop") {
                state.iconPickerOpen = true;
            }
            if (params.get("icons") === "modal") {
                state.iconModalOpen = true;
            }
            if (params.get("append") === "1") {
                state.appendAfter = true;
            }
            if (params.get("pick") !== null) {
                const type = ACTIONS.find((action) => action.id === params.get("pick"));
                if (type) {
                    state.picked = type.id;
                    state.provider = providerOfAction(type);
                    state.values = defaultValues(type);
                }
            }

            renderPageList();
            renderAll();
        </script>
    </body>
</html>
