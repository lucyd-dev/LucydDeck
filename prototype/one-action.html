<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1280" />
        <title>One action per key prototype</title>
        <!--
            PROTOTYPE, throwaway.

            One key, one action. The view follows the saved data: one action
            shows the single action card with an "Add step after this" link,
            two or more show the sequence list. The link puts the dock into
            append mode and the view switches to the sequence once a second
            step lands.

            The top bar groups the key preview, Color and Icon together. The
            Clear control is a red destructive button at the top right. Key
            icons are PNG-only. The icon control opens a recent-icon popover;
            Browse all opens the full PNG library with import.

            400px inspector. Standalone because the real editor needs Electron
            IPC and a profile on disk.
        -->
        <style>
            :root {
                --font-sans:
                    "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                    sans-serif;
                --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
                --space-2xs: 2px;
                --space-xs: 4px;
                --space-sm: 8px;
                --space-md: 12px;
                --space-lg: 16px;
                --space-xl: 24px;
                --radius-sm: 4px;
                --radius-md: 6px;
                --radius-lg: 10px;
                --radius-full: 999px;
                --sidebar-width: 240px;
                --inspector-width: 400px;
                --transition-fast: 120ms ease;

                --color-bg: #14171d;
                --color-bg-elevated: #1c2129;
                --color-bg-hover: #232933;
                --color-surface: #262b35;
                --color-input-bg: #12151b;
                --color-border: #343c49;
                --color-text: #e6e9ef;
                --color-text-dim: #9aa3b2;
                --color-text-faint: #6b7280;
                --color-success: #3fbf7f;
                --color-warning: #e6a23c;
                --color-error: #e5475b;
                --color-disabled: #4b5462;
                --color-accent: #7c6cf0;
                --color-accent-contrast: #ffffff;
                --color-accent-soft: color-mix(in srgb, var(--color-accent) 16%, transparent);
                --color-accent-border: color-mix(in srgb, var(--color-accent) 50%, transparent);
                --shadow-1: 0 4px 12px rgb(0 0 0 / 35%);
                --shadow-2: 0 12px 28px rgb(0 0 0 / 45%);
                --shadow-3: 0 24px 60px rgb(0 0 0 / 55%);

                color-scheme: dark;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                overflow: hidden;
                background-color: var(--color-bg);
                color: var(--color-text);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.45;
            }

            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }

            button {
                cursor: pointer;
            }

            button:focus-visible,
            input:focus-visible,
            select:focus-visible,
            textarea:focus-visible {
                outline: 2px solid var(--color-accent);
                outline-offset: 1px;
            }

            svg {
                display: block;
                flex: 0 0 auto;
            }

            .app-shell {
                display: grid;
                grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--inspector-width);
                height: 100vh;
                overflow: hidden;
            }

            /* ---- Sidebar -------------------------------------------------- */

            .sidebar {
                display: flex;
                flex-direction: column;
                min-height: 0;
                border-right: 1px solid var(--color-border);
                background-color: var(--color-bg-elevated);
                user-select: none;
            }

            .sidebar__brand {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
                padding: var(--space-lg) var(--space-lg) var(--space-md);
                font-weight: 700;
                letter-spacing: 0.02em;
            }

            .sidebar__brand-mark {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: var(--radius-md);
                background-color: var(--color-accent);
                color: var(--color-accent-contrast);
            }

            .sidebar__views {
                display: flex;
                gap: var(--space-xs);
                padding: 0 var(--space-lg) var(--space-md);
            }

            .sidebar__view {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                padding: 0;
                border: 1px solid transparent;
                border-radius: var(--radius-md);
                background: transparent;
                color: var(--color-text-dim);
            }

            .sidebar__view:hover {
                background-color: var(--color-bg-hover);
                color: var(--color-text);
            }

            .sidebar__view--active {
                border-color: var(--color-accent-border);
                background-color: var(--color-accent-soft);
                color: var(--color-accent);
            }

            .sidebar__body {
                flex: 1;
                min-height: 0;
                padding: var(--space-sm) var(--space-md);
                overflow-y: auto;
                border-top: 1px solid var(--color-border);
            }

            .sidebar__section-title {
                margin: var(--space-sm) 0 var(--space-xs);
                color: var(--color-text-faint);
                font-size: 0.7rem;
                font-weight: 600;
                letter-spacing: 0.07em;
                text-transform: uppercase;
            }

            .deck-actions {
                display: flex;
                gap: var(--space-xs);
            }

            .sidebar-button {
                display: inline-flex;
                flex: 1;
                align-items: center;
                justify-content: center;
                gap: var(--space-xs);
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg-hover);
                color: var(--color-text-dim);
                font-size: 0.76rem;
                font-weight: 600;
            }

            .sidebar-button--primary {
                border-color: var(--color-accent);
                background-color: var(--color-accent-soft);
                color: var(--color-text);
            }

            .profile-select {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-sm);
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
                color: var(--color-text-dim);
                font-size: 0.8rem;
            }

            .profile-select strong {
                margin-left: auto;
                color: var(--color-text);
                font-weight: 500;
            }

            .page-list {
                display: flex;
                flex-direction: column;
                gap: var(--space-xs);
            }

            .page-card {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
                width: 100%;
                padding: var(--space-xs);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--color-bg);
                color: var(--color-text-dim);
                text-align: left;
            }

            .page-card:hover {
                border-color: var(--color-text-faint);
            }

            .page-card--active {
                border-color: var(--color-accent-border);
                background-color: var(--color-accent-soft);
                color: var(--color-text);
            }

            .page-thumb {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 1px;
                width: 46px;
                padding: 2px;
                border-radius: 3px;
                background-color: #0f1217;
                aspect-ratio: 5 / 3;
            }

            .page-thumb span {
                border-radius: 1px;
                background-color: var(--page-cell, #262b35);
            }

            .page-card__body {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            .page-card__name {
                color: var(--color-text);
                font-size: 0.8rem;
            }

            .page-card__meta {
                color: var(--color-text-faint);
                font-size: 0.68rem;
            }

            .sidebar__footer {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                padding: var(--space-md);
                border-top: 1px solid var(--color-border);
            }

            .device-chip {
                display: inline-flex;
                flex: 1;
                align-items: center;
                gap: var(--space-xs);
                min-width: 0;
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-full);
                background-color: var(--color-bg);
                color: var(--color-success);
                font-size: 0.76rem;
                text-align: left;
            }

            .device-chip__dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background-color: currentColor;
            }

            /* ---- Board ---------------------------------------------------- */

            .content {
                min-width: 0;
                min-height: 0;
                overflow: auto;
                background-color: var(--color-bg);
            }

            .view--board {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 0;
                padding: var(--space-xl);
            }

            .board-header {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                justify-content: center;
                gap: var(--space-lg);
                margin-bottom: var(--space-md);
            }

            .page-switcher {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: var(--space-xs);
            }

            .page-switcher__pill {
                padding: var(--space-2xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-full);
                background-color: var(--color-bg-hover);
                color: var(--color-text-dim);
                font-size: 0.78rem;
            }

            .page-switcher__pill--active {
                border-color: var(--color-accent);
                background-color: var(--color-accent-soft);
                color: var(--color-accent);
            }

            .page-switcher__add {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                padding: 0;
                border: 1px dashed var(--color-border);
                border-radius: var(--radius-full);
                background: transparent;
                color: var(--color-text-dim);
            }

            .board-canvas {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                grid-template-rows: repeat(3, minmax(0, 1fr));
                gap: var(--space-md);
                width: 100%;
                max-width: min(100%, calc((100dvh - 150px) * 5 / 3));
                margin: 0 auto;
            }

            .key-button {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 0;
                aspect-ratio: 1 / 1;
                padding: var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-lg);
                background-color: var(--color-surface);
                color: var(--color-text);
                transition:
                    border-color 100ms ease,
                    box-shadow 100ms ease;
            }

            .key-button:hover {
                border-color: var(--color-text-faint);
            }

            .key-button--selected {
                border-color: var(--color-accent);
                box-shadow: 0 0 0 2px var(--color-accent-soft);
            }

            .key-button--empty {
                border-style: dashed;
                background-color: var(--color-bg-elevated);
            }

            .key-button__icon {
                width: 58%;
                height: 58%;
                object-fit: contain;
                opacity: 0.9;
            }

            .key-button__index {
                position: absolute;
                top: var(--space-xs);
                left: var(--space-sm);
                color: var(--color-text-faint);
                font-size: 0.72rem;
            }

            .key-button__label {
                max-width: 100%;
                margin-top: var(--space-xs);
                overflow: hidden;
                font-size: 0.78rem;
                text-align: center;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .key-button__badge {
                position: absolute;
                right: var(--space-xs);
                bottom: var(--space-xs);
                padding: 0 var(--space-2xs);
                border-radius: var(--radius-sm);
                background-color: rgb(0 0 0 / 45%);
                color: var(--color-text-dim);
                font-size: 0.68rem;
            }

            /* ---- Panel shared --------------------------------------------- */

            .inspector {
                display: flex;
                flex-direction: column;
                min-height: 0;
                overflow: hidden;
                border-left: 1px solid var(--color-border);
                background-color: var(--color-bg-elevated);
            }

            .panel {
                position: relative;
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
            }

            .panel-scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 0 var(--space-md);
            }

            .panel-foot {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-sm);
                padding: var(--space-sm) var(--space-md);
                border-top: 1px solid var(--color-border);
                color: var(--color-text-faint);
                font-size: 0.7rem;
            }

            .panel-foot__version {
                display: inline-flex;
                align-items: center;
                gap: var(--space-xs);
                font-family: var(--font-mono);
                color: var(--color-text-dim);
            }

            .cat-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                flex: 0 0 auto;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
                color: var(--color-text-dim);
            }

            .cat-icon--deck {
                color: #8f8af4;
            }

            .cat-icon--keyboard {
                color: #69b7e8;
            }

            .cat-icon--mouse {
                color: #7fd1b0;
            }

            .cat-icon--text {
                color: #e8c06a;
            }

            .cat-icon--timing {
                color: #d99a7a;
            }

            .cat-icon--commands {
                color: #b7b0f5;
            }

            .cat-icon--plugins {
                color: #e58fbf;
            }

            .row-controls {
                display: flex;
                flex: 0 0 auto;
                gap: 2px;
                margin-left: auto;
            }

            .row-control {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                padding: 0;
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-faint);
            }

            .row-control:hover:not(:disabled) {
                border-color: var(--color-border);
                background-color: var(--color-bg-hover);
                color: var(--color-text);
            }

            .row-control--danger:hover:not(:disabled) {
                border-color: var(--color-error);
                color: var(--color-error);
            }

            .row-control:disabled {
                cursor: not-allowed;
                opacity: 0.35;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: var(--space-2xs);
                min-width: 0;
            }

            .field__label {
                color: var(--color-text-faint);
                font-size: 0.68rem;
            }

            .input,
            .select {
                width: 100%;
                min-width: 0;
                padding: var(--space-2xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-input-bg);
                color: var(--color-text);
                font-size: 0.8rem;
            }

            textarea.input {
                resize: vertical;
                min-height: 48px;
                font-size: 0.78rem;
            }

            .invalid-note {
                margin: var(--space-xs) 0 0;
                color: var(--color-error);
                font-size: 0.72rem;
            }

            .mono {
                font-family: var(--font-mono);
                font-size: 0.72rem;
            }

            /* ---- Variant A: inline list ---------------------------------- */

            .v-a-top {
                position: relative;
                flex: 0 0 auto;
                padding: var(--space-md) var(--space-md) 0;
            }

            .icon-pop {
                position: absolute;
                top: 72px;
                left: var(--space-md);
                z-index: 20;
                width: 236px;
                padding: var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--color-bg-elevated);
                box-shadow: var(--shadow-2);
            }

            .icon-pop__head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-sm);
                margin-bottom: 6px;
                color: var(--color-text-faint);
                font-size: 0.66rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .icon-pop__head button {
                padding: 0;
                border: none;
                background: transparent;
                color: var(--color-accent);
                font-size: 0.64rem;
                font-weight: 600;
                letter-spacing: 0;
                text-transform: none;
            }

            .icon-pop__head button:hover {
                text-decoration: underline;
            }

            .icon-pop__grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 5px;
                max-height: 118px;
                overflow-y: auto;
            }

            .icon-tile {
                display: flex;
                align-items: center;
                justify-content: center;
                aspect-ratio: 1;
                min-width: 0;
                padding: 8px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
            }

            .icon-tile:hover {
                border-color: var(--color-text-faint);
            }

            .icon-tile--active {
                border-color: var(--color-accent);
                background-color: var(--color-accent-soft);
                box-shadow: inset 0 0 0 1px var(--color-accent);
            }

            .icon-tile img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .icon-modal {
                position: fixed;
                inset: 0;
                z-index: 300;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: var(--space-xl);
                background-color: var(--color-overlay);
            }

            .icon-modal__dialog {
                display: flex;
                flex-direction: column;
                width: min(440px, 100%);
                max-height: min(620px, 82vh);
                overflow: hidden;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-lg);
                background-color: var(--color-bg-elevated);
                box-shadow: var(--shadow-3);
            }

            .icon-modal__head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-sm);
                padding: var(--space-md) var(--space-lg);
                border-bottom: 1px solid var(--color-border);
            }

            .icon-modal__head h3 {
                margin: 0;
                font-size: 0.86rem;
                font-weight: 600;
            }

            .icon-modal__close {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 24px;
                height: 24px;
                padding: 0;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-faint);
            }

            .icon-modal__close:hover {
                color: var(--color-text);
            }

            .icon-modal__grid {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: var(--space-sm);
                padding: var(--space-lg);
                overflow-y: auto;
            }

            .icon-modal__grid .icon-tile {
                padding: 10px;
            }

            .icon-modal__foot {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
                padding: var(--space-sm) var(--space-lg);
                border-top: 1px solid var(--color-border);
                background-color: var(--color-bg);
            }

            .icon-import {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 4px 8px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg-hover);
                color: var(--color-text);
                font-size: 0.72rem;
                font-weight: 600;
                cursor: pointer;
            }

            .icon-import:hover {
                border-color: var(--color-text-faint);
            }

            .icon-import input {
                display: none;
            }

            .icon-modal__hint {
                margin-left: auto;
                color: var(--color-text-faint);
                font-size: 0.64rem;
            }

            .v-a-sequence {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
                padding: 0 var(--space-md);
            }

            .v-a-list-scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 0 2px var(--space-sm) 0;
            }

            .v-a-head {
                display: flex;
                align-items: flex-start;
                gap: var(--space-sm);
                padding: 0 0 var(--space-sm);
            }

            .v-a-preview {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 56px;
                height: 56px;
                flex: 0 0 auto;
                padding: 9px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--key-bg, var(--color-surface));
            }

            .v-a-preview:hover {
                border-color: var(--color-text-faint);
            }

            .v-a-preview img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .key-icon-placeholder {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: var(--color-text-faint);
            }

            .v-a-head-body {
                display: flex;
                flex: 1;
                flex-direction: column;
                gap: 5px;
                min-width: 0;
            }

            .v-a-title-row {
                display: flex;
                align-items: flex-start;
                gap: var(--space-sm);
            }

            .v-a-title {
                flex: 1;
                min-width: 0;
                width: 100%;
                padding: var(--space-2xs) 0;
                border: none;
                border-bottom: 1px solid transparent;
                background: transparent;
                color: var(--color-text);
                font-size: 1rem;
                font-weight: 600;
            }

            .v-a-title:hover {
                border-bottom-color: var(--color-border);
            }

            .v-a-title:focus {
                border-bottom-color: var(--color-accent);
                outline: none;
            }

            .clear-key {
                display: inline-flex;
                flex: 0 0 auto;
                align-items: center;
                gap: 4px;
                padding: 3px 7px;
                border: 1px solid color-mix(in srgb, var(--color-error) 60%, var(--color-border));
                border-radius: var(--radius-sm);
                background-color: color-mix(in srgb, var(--color-error) 10%, transparent);
                color: var(--color-error);
                font-size: 0.68rem;
                font-weight: 600;
            }

            .clear-key:hover {
                border-color: var(--color-error);
                background-color: var(--color-error);
                color: #fff;
            }

            .v-a-appearance {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 5px;
            }

            .appearance-control {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                height: 25px;
                padding: 0 7px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
                color: var(--color-text-dim);
                font-size: 0.68rem;
            }

            .appearance-color {
                position: relative;
                overflow: hidden;
                cursor: pointer;
            }

            .appearance-color:hover,
            .appearance-icon:hover {
                border-color: var(--color-text-faint);
                color: var(--color-text);
            }

            .appearance-swatch {
                width: 12px;
                height: 12px;
                border: 1px solid rgb(255 255 255 / 25%);
                border-radius: 3px;
            }

            .appearance-color__input {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                padding: 0;
                border: none;
                opacity: 0;
                cursor: pointer;
            }

            .appearance-icon__img {
                width: 14px;
                height: 14px;
                object-fit: contain;
            }

            .v-a-bar {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: var(--space-sm);
                margin: var(--space-sm) 0 var(--space-xs);
                padding-top: var(--space-sm);
                border-top: 1px solid var(--color-border);
                color: var(--color-text-faint);
                font-size: 0.68rem;
                font-weight: 600;
                letter-spacing: 0.07em;
                text-transform: uppercase;
            }

            .v-a-bar__meta {
                font-weight: 400;
                letter-spacing: 0;
                text-transform: none;
            }

            .v-a-bar--mode {
                align-items: center;
            }

            .mode-switch {
                display: inline-flex;
                gap: 2px;
                padding: 2px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
            }

            .mode-switch button {
                padding: 2px 8px;
                border: none;
                border-radius: 3px;
                background: transparent;
                color: var(--color-text-faint);
                font-size: 0.66rem;
                font-weight: 600;
                letter-spacing: 0;
                text-transform: none;
            }

            .mode-switch button:hover {
                color: var(--color-text);
            }

            .mode-switch .mode-switch__item--active {
                background-color: var(--color-accent-soft);
                box-shadow: inset 0 0 0 1px var(--color-accent-border);
                color: var(--color-text);
            }

            .action-slot {
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--color-surface);
                overflow: hidden;
            }

            .action-slot--open {
                border-color: var(--color-accent-border);
            }

            .action-slot--invalid {
                border-color: color-mix(in srgb, var(--color-error) 60%, var(--color-border));
            }

            .action-slot__row {
                display: flex;
                align-items: center;
            }

            .action-slot__main {
                display: flex;
                flex: 1;
                align-items: center;
                gap: 10px;
                min-width: 0;
                padding: var(--space-md);
                border: none;
                background: transparent;
                color: var(--color-text);
                text-align: left;
            }

            .action-slot__main:hover {
                background-color: var(--color-bg-hover);
            }

            .action-slot__icon {
                width: 34px;
                height: 34px;
            }

            .action-slot__body {
                display: flex;
                flex-direction: column;
                min-width: 0;
                gap: 2px;
            }

            .action-slot__label {
                overflow: hidden;
                font-size: 0.86rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .action-slot__detail {
                overflow: hidden;
                color: var(--color-text-faint);
                font-size: 0.7rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .action-slot .row-controls {
                padding-right: var(--space-sm);
            }

            .action-slot__editor {
                padding: var(--space-sm) var(--space-md) var(--space-md);
                border-top: 1px solid var(--color-border);
                background-color: var(--color-bg);
            }

            .slot-note {
                display: flex;
                align-items: flex-start;
                gap: 6px;
                margin: var(--space-sm) 0 0;
                padding: var(--space-sm);
                border: 1px solid color-mix(in srgb, var(--color-warning) 45%, var(--color-border));
                border-radius: var(--radius-sm);
                color: var(--color-warning);
                font-size: 0.7rem;
                line-height: 1.45;
            }

            .slot-note svg {
                margin-top: 1px;
            }

            .then-toggle {
                display: flex;
                align-items: center;
                gap: 5px;
                width: 100%;
                margin-top: var(--space-sm);
                padding: var(--space-xs) var(--space-sm);
                border: 1px dashed var(--color-border);
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-dim);
                font-size: 0.72rem;
                text-align: left;
            }

            .then-toggle:hover {
                border-color: var(--color-text-faint);
                color: var(--color-text);
            }

            .then-list {
                margin: var(--space-xs) 0 0;
                padding-left: var(--space-sm);
                border-left: 2px solid var(--color-border);
            }

            .v-a-list {
                display: flex;
                flex-direction: column;
                gap: var(--space-xs);
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .v-a-step {
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-surface);
                overflow: hidden;
            }

            .v-a-step--open {
                border-color: var(--color-accent-border);
            }

            .v-a-step--invalid {
                border-color: color-mix(in srgb, var(--color-error) 60%, var(--color-border));
            }

            .v-a-step__row {
                display: flex;
                align-items: center;
                gap: 0;
            }

            .v-a-step__main {
                display: flex;
                flex: 1;
                align-items: center;
                gap: var(--space-sm);
                min-width: 0;
                padding: var(--space-xs);
                border: none;
                background: transparent;
                color: var(--color-text);
                text-align: left;
            }

            .v-a-step__main:hover {
                background-color: var(--color-bg-hover);
            }

            .v-a-step__row .row-controls {
                padding-right: var(--space-2xs);
            }

            .v-a-step__num {
                width: 14px;
                flex: 0 0 auto;
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.66rem;
                text-align: right;
            }

            .v-a-step__text {
                display: flex;
                flex-direction: column;
                min-width: 0;
                gap: 1px;
            }

            .v-a-step__label {
                overflow: hidden;
                font-size: 0.8rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .v-a-step__detail {
                overflow: hidden;
                color: var(--color-text-faint);
                font-size: 0.68rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .v-a-step__editor {
                padding: var(--space-xs) var(--space-sm) var(--space-sm);
                border-top: 1px solid var(--color-border);
                background-color: var(--color-bg);
            }

            .v-a-step__fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--space-xs);
            }

            .v-a-step__fields .field--wide {
                grid-column: 1 / -1;
            }

            .v-a-add {
                margin: var(--space-sm) 0 var(--space-md);
                padding-top: var(--space-sm);
                border-top: 1px dashed var(--color-border);
            }

            .add-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: var(--space-2xs);
                width: 100%;
                padding: var(--space-sm);
                border: 1px solid var(--color-accent-border);
                border-radius: var(--radius-sm);
                background-color: transparent;
                color: var(--color-text-dim);
                font-size: 0.8rem;
                font-weight: 600;
            }

            .add-trigger:hover {
                background-color: var(--color-accent-soft);
                color: var(--color-text);
            }

            .add-trigger--open {
                border-style: dashed;
                color: var(--color-accent);
            }

            .v-a-panel {
                margin-top: var(--space-sm);
                padding: var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
            }

            .category-chips {
                display: flex;
                flex-wrap: wrap;
                gap: var(--space-2xs);
                margin-bottom: var(--space-sm);
            }

            .category-chip {
                padding: 2px var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-full);
                background-color: transparent;
                color: var(--color-text-dim);
                font-size: 0.7rem;
            }

            .category-chip:hover {
                color: var(--color-text);
            }

            .category-chip--active {
                border-color: var(--color-accent-border);
                background-color: var(--color-accent-soft);
                color: var(--color-accent);
            }

            .action-list {
                display: flex;
                flex-direction: column;
                gap: 1px;
                max-height: 190px;
                overflow-y: auto;
                margin: 0 -2px;
                padding: 0 2px;
            }

            .action-row {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
                width: 100%;
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text);
                text-align: left;
            }

            .action-row:hover {
                background-color: var(--color-bg-hover);
            }

            .action-row--active {
                border-color: var(--color-accent-border);
                background-color: var(--color-accent-soft);
            }

            .action-row__body {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            .action-row__label {
                font-size: 0.78rem;
            }

            .action-row__meta {
                color: var(--color-text-faint);
                font-size: 0.66rem;
            }

            .draft {
                margin-top: var(--space-sm);
                padding-top: var(--space-sm);
                border-top: 1px solid var(--color-border);
            }

            .draft__fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--space-xs);
                margin-top: var(--space-xs);
            }

            .draft__summary {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                min-width: 0;
            }

            .draft__summary-text {
                overflow: hidden;
                font-size: 0.78rem;
                font-weight: 600;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .draft__change {
                margin-left: auto;
                padding: 0;
                border: none;
                background: transparent;
                color: var(--color-text-faint);
                font-size: 0.68rem;
                text-decoration: underline;
            }

            .draft__change:hover {
                color: var(--color-text);
            }

            .draft__fields .field--wide {
                grid-column: 1 / -1;
            }

            .draft__actions {
                display: flex;
                gap: var(--space-xs);
                margin-top: var(--space-sm);
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--space-2xs);
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg-hover);
                color: var(--color-text-dim);
                font-size: 0.75rem;
                font-weight: 600;
            }

            .button:hover {
                color: var(--color-text);
            }

            .button--primary {
                flex: 1;
                border-color: var(--color-accent);
                background-color: var(--color-accent-soft);
                color: var(--color-text);
            }

            .empty {
                padding: var(--space-lg) var(--space-sm);
                border: 1px dashed var(--color-border);
                border-radius: var(--radius-sm);
                color: var(--color-text-faint);
                font-size: 0.78rem;
                text-align: center;
            }

            /* ---- Variant B: command palette ------------------------------ */

            .v-b-head {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
                padding: var(--space-md) 0 var(--space-sm);
            }

            .v-b-key {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                flex: 0 0 auto;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--key-bg, var(--color-surface));
            }

            .v-b-head-body {
                min-width: 0;
            }

            .v-b-eyebrow {
                color: var(--color-text-faint);
                font-size: 0.66rem;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .v-b-title {
                width: 100%;
                padding: 0;
                border: none;
                background: transparent;
                color: var(--color-text);
                font-size: 0.95rem;
                font-weight: 600;
            }

            .v-b-title:focus {
                outline: none;
            }

            .v-b-clear {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                margin-left: auto;
                padding: 0;
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-faint);
            }

            .v-b-clear:hover {
                border-color: var(--color-error);
                color: var(--color-error);
            }

            .v-b-toolbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-sm);
                padding: var(--space-2xs) 0 var(--space-sm);
                border-bottom: 1px solid var(--color-border);
                color: var(--color-text-faint);
                font-size: 0.68rem;
            }

            .v-b-toolbar strong {
                color: var(--color-text-dim);
                font-weight: 500;
            }

            .v-b-timeline {
                position: relative;
                display: flex;
                flex-direction: column;
                gap: var(--space-xs);
                margin: 0;
                padding: var(--space-sm) 0 0 22px;
                list-style: none;
            }

            .v-b-timeline::before {
                position: absolute;
                top: 14px;
                bottom: 14px;
                left: 9px;
                width: 1px;
                background-color: var(--color-border);
                content: "";
            }

            .v-b-node {
                position: relative;
            }

            .v-b-node__dot {
                position: absolute;
                top: 9px;
                left: -19px;
                z-index: 1;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 16px;
                height: 16px;
                border: 1px solid var(--color-border);
                border-radius: 50%;
                background-color: var(--color-bg-elevated);
                color: var(--color-text-faint);
            }

            .v-b-node__dot svg {
                width: 9px;
                height: 9px;
            }

            .v-b-node--open .v-b-node__dot {
                border-color: var(--color-accent);
                color: var(--color-accent);
            }

            .v-b-node--invalid .v-b-node__dot {
                border-color: var(--color-error);
                color: var(--color-error);
            }

            .v-b-node__button {
                display: flex;
                flex-direction: column;
                width: 100%;
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text);
                text-align: left;
            }

            .v-b-node__button:hover {
                border-color: var(--color-border);
                background-color: var(--color-bg-hover);
            }

            .v-b-node--open .v-b-node__button {
                border-color: var(--color-accent-border);
                background-color: var(--color-accent-soft);
            }

            .v-b-node__label {
                overflow: hidden;
                font-size: 0.8rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .v-b-node__detail {
                overflow: hidden;
                color: var(--color-text-faint);
                font-size: 0.68rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .v-b-node__meta {
                position: absolute;
                top: 6px;
                right: 4px;
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.62rem;
            }

            .v-b-node__editor {
                padding: var(--space-xs) var(--space-sm) var(--space-sm);
                border: 1px solid var(--color-accent-border);
                border-top: none;
                border-radius: 0;
                background-color: var(--color-bg);
            }

            .v-b-node__editor .field:last-child {
                margin-bottom: 0;
            }

            .v-b-node__controls {
                display: flex;
                gap: 2px;
                justify-content: flex-end;
                margin-top: 0;
                padding: 2px var(--space-xs);
                border: 1px solid var(--color-accent-border);
                border-top: none;
                border-radius: 0 0 var(--radius-sm) var(--radius-sm);
                background-color: var(--color-bg);
            }

            .v-b-add-bar {
                position: sticky;
                bottom: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: var(--space-xs);
                margin: var(--space-sm) 0 var(--space-md);
                padding: var(--space-sm);
                border: 1px solid var(--color-accent);
                border-radius: var(--radius-full);
                background-color: var(--color-bg-elevated);
                color: var(--color-text);
                font-size: 0.8rem;
                font-weight: 600;
                box-shadow: var(--shadow-1);
            }

            .v-b-add-bar__key {
                margin-left: var(--space-xs);
                padding: 0 var(--space-2xs);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.64rem;
            }

            .v-b-sheet {
                position: absolute;
                inset: 0;
                z-index: 4;
                display: flex;
                flex-direction: column;
                background-color: var(--color-bg-elevated);
            }

            .v-b-sheet__head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-sm);
                padding: var(--space-md);
                border-bottom: 1px solid var(--color-border);
            }

            .v-b-sheet__title {
                margin: 0;
                font-size: 0.85rem;
                font-weight: 600;
            }

            .v-b-close {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 24px;
                height: 24px;
                padding: 0;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-faint);
            }

            .v-b-search {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                margin: var(--space-md) var(--space-md) 0;
                padding: var(--space-xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-input-bg);
                color: var(--color-text-faint);
            }

            .v-b-search input {
                flex: 1;
                min-width: 0;
                border: none;
                background: transparent;
                font-size: 0.8rem;
            }

            .v-b-search input:focus {
                outline: none;
            }

            .v-b-cats {
                display: flex;
                flex-wrap: wrap;
                gap: var(--space-2xs);
                padding: var(--space-sm) var(--space-md);
            }

            .v-b-results {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 0 var(--space-md) var(--space-md);
            }

            .v-b-group {
                margin: 0 0 var(--space-xs);
                color: var(--color-text-faint);
                font-size: 0.66rem;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            .v-b-draft {
                flex: 0 0 auto;
                padding: var(--space-md);
                border-top: 1px solid var(--color-border);
                background-color: var(--color-bg);
            }

            .v-b-sheet > .draft {
                flex: 1;
                min-height: 0;
                margin: 0;
                padding: var(--space-md);
                border-top: none;
                overflow-y: auto;
            }

            .v-c-pop > .draft {
                flex: 0 0 auto;
                margin: 0;
                padding: var(--space-sm);
                border-top: 1px solid var(--color-border);
                overflow-y: auto;
            }

            /* ---- Variant C: step cards ----------------------------------- */

            .v-c-head {
                padding: var(--space-md) 0 var(--space-sm);
                border-bottom: 1px solid var(--color-border);
            }

            .v-c-title {
                width: 100%;
                padding: var(--space-2xs) 0;
                border: none;
                border-bottom: 1px dashed transparent;
                background: transparent;
                color: var(--color-text);
                font-size: 1.05rem;
                font-weight: 600;
            }

            .v-c-title:hover {
                border-bottom-color: var(--color-border);
            }

            .v-c-title:focus {
                border-bottom-color: var(--color-accent);
                outline: none;
            }

            .v-c-meta {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
                color: var(--color-text-faint);
                font-size: 0.7rem;
            }

            .v-c-meta .color-swatch {
                width: 16px;
                height: 16px;
            }

            .v-c-list {
                display: flex;
                flex-direction: column;
                gap: var(--space-sm);
                margin: 0;
                padding: var(--space-sm) 0 var(--space-md);
            }

            .v-c-card {
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--color-surface);
                overflow: hidden;
            }

            .v-c-card--invalid {
                border-color: color-mix(in srgb, var(--color-error) 55%, var(--color-border));
            }

            .v-c-card__head {
                display: flex;
                align-items: flex-start;
                gap: var(--space-sm);
                padding: var(--space-sm);
            }

            .v-c-card__num {
                padding-top: 3px;
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.66rem;
            }

            .v-c-card__body {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                gap: 1px;
            }

            .v-c-card__label {
                font-size: 0.8rem;
            }

            .v-c-card__detail {
                color: var(--color-text-faint);
                font-size: 0.66rem;
            }

            .v-c-card__fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--space-xs);
                margin: 0 var(--space-sm) var(--space-sm);
                padding: var(--space-xs) var(--space-sm);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
            }

            .v-c-card__fields .field--wide {
                grid-column: 1 / -1;
            }

            .v-c-card__fields .field__label {
                font-size: 0.64rem;
            }

            .v-c-card__fields .input,
            .v-c-card__fields .select {
                padding: 1px 6px;
                font-size: 0.74rem;
            }

            .v-c-addbar {
                position: relative;
                flex: 0 0 auto;
                padding: var(--space-sm) var(--space-md) var(--space-md);
                border-top: 1px solid var(--color-border);
                background-color: var(--color-bg-elevated);
            }

            .v-c-addbar .add-trigger {
                border-radius: var(--radius-md);
            }

            .v-c-pop {
                position: absolute;
                right: var(--space-md);
                bottom: calc(100% - 4px);
                left: var(--space-md);
                z-index: 5;
                display: flex;
                flex-direction: column;
                max-height: 392px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                background-color: var(--color-bg);
                box-shadow: var(--shadow-2);
                overflow: hidden;
            }

            .v-c-pop__head {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                padding: var(--space-sm) var(--space-sm) var(--space-xs);
                border-bottom: 1px solid var(--color-border);
            }

            .v-c-pop__title {
                margin: 0;
                color: var(--color-text-dim);
                font-size: 0.7rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .v-c-pop__close {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                margin-left: auto;
                padding: 0;
                border: none;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-faint);
            }

            .v-c-pop__search {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                margin: var(--space-xs) var(--space-sm);
                padding: var(--space-2xs) var(--space-sm);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-input-bg);
                color: var(--color-text-faint);
            }

            .v-c-pop__search input {
                flex: 1;
                min-width: 0;
                border: none;
                background: transparent;
                font-size: 0.76rem;
            }

            .v-c-pop__search input:focus {
                outline: none;
            }

            .v-c-groups {
                min-height: 0;
                overflow-y: auto;
                padding: 0 var(--space-sm) var(--space-sm);
            }

            .v-c-group__title {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                margin: var(--space-sm) 0 var(--space-2xs);
                color: var(--color-text-faint);
                font-size: 0.66rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .v-c-group .action-row {
                padding: 3px var(--space-sm);
            }

            .v-c-draft {
                margin-top: var(--space-sm);
                padding: var(--space-sm);
                border: 1px solid var(--color-accent-border);
                border-radius: var(--radius-sm);
                background-color: var(--color-bg);
            }

            .v-c-draft__head {
                display: flex;
                align-items: center;
                gap: var(--space-xs);
                margin-bottom: var(--space-xs);
                font-size: 0.76rem;
                font-weight: 600;
            }

            /* ---- Add Action dock ----------------------------------------- */

            .add-dock {
                display: flex;
                flex: 0 0 auto;
                flex-direction: column;
                min-height: 0;
                border-top: 1px solid var(--color-border);
                background-color: var(--color-bg);
            }

            .add-dock--open {
                height: 352px;
            }

            .add-dock__head {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: var(--space-xs);
                width: 100%;
                height: 38px;
                padding: 0 var(--space-md);
                border: none;
                border-bottom: 1px solid transparent;
                background: transparent;
                text-align: left;
            }

            .add-dock__head:hover {
                background-color: var(--color-bg-hover);
            }

            .add-dock--open .add-dock__head {
                border-bottom-color: var(--color-border);
            }

            .add-dock__mark {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 20px;
                height: 20px;
                flex: 0 0 auto;
                border-radius: var(--radius-sm);
                background-color: var(--color-accent-soft);
                color: var(--color-accent);
            }

            .add-dock__title {
                margin: 0;
                color: var(--color-text);
                font-size: 0.8rem;
                font-weight: 650;
                letter-spacing: 0.01em;
            }

            .add-dock__chev {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                margin-left: auto;
                color: var(--color-text-faint);
            }

            .add-dock__body {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
            }

            .append-banner {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: 6px;
                padding: 5px var(--space-md);
                border-bottom: 1px solid var(--color-accent-border);
                background-color: var(--color-accent-soft);
                color: var(--color-text-dim);
                font-size: 0.68rem;
            }

            .append-banner span {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .append-banner button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 20px;
                height: 20px;
                padding: 0;
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-faint);
            }

            .append-banner button:hover {
                border-color: var(--color-border);
                background-color: var(--color-bg-hover);
                color: var(--color-text);
            }

            .add-step-link {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                margin: var(--space-sm) 2px 0;
                padding: 0;
                border: none;
                background: transparent;
                color: var(--color-text-faint);
                font-size: 0.7rem;
            }

            .add-step-link:hover {
                color: var(--color-text);
            }

            .add-focus {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }

            .add-focus__crumbs {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: var(--space-sm);
                min-width: 0;
                padding: 6px var(--space-md);
                border-bottom: 1px solid var(--color-border);
            }

            .add-focus__back {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                flex: 0 0 auto;
                padding: 3px 7px;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background-color: transparent;
                color: var(--color-text-dim);
                font-size: 0.7rem;
            }

            .add-focus__back:hover {
                border-color: var(--color-text-faint);
                color: var(--color-text);
            }

            .add-focus__path {
                overflow: hidden;
                color: var(--color-text-faint);
                font-size: 0.68rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .add-focus__body {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: var(--space-md);
            }

            .add-focus__foot {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                justify-content: flex-end;
                padding: 6px var(--space-md);
                border-top: 1px solid var(--color-border);
            }

            .add-split {
                display: flex;
                flex: 1;
                width: 100%;
                min-height: 0;
            }

            .provider-menu {
                display: flex;
                flex: 0 0 148px;
                flex-direction: column;
                gap: 1px;
                padding: var(--space-xs);
                overflow-y: auto;
                border-right: 1px solid var(--color-border);
            }

            .provider-row {
                display: flex;
                align-items: center;
                gap: 5px;
                width: 100%;
                padding: 5px 6px;
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-dim);
                font-size: 0.7rem;
                text-align: left;
            }

            .provider-row:hover {
                background-color: var(--color-bg-hover);
                color: var(--color-text);
            }

            .provider-row--active {
                background-color: var(--color-accent-soft);
                box-shadow: inset 2px 0 0 var(--color-accent);
                color: var(--color-text);
            }

            .provider-row__icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 16px;
                flex: 0 0 auto;
                color: var(--color-text-faint);
            }

            .provider-row--active .provider-row__icon {
                color: var(--color-accent);
            }

            .provider-row__label {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .provider-row__count {
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.58rem;
            }

            .provider-row--empty .provider-row__count {
                opacity: 0.7;
            }

            .add-pane {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }

            .add-pane__head {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-xs);
                padding: 6px 8px 4px;
                color: var(--color-text-faint);
                font-size: 0.62rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .add-pane__head span:last-child {
                font-weight: 400;
                letter-spacing: 0;
                text-transform: none;
            }

            .add-pane__scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 2px var(--space-xs) var(--space-xs);
            }

            .add-pane__empty {
                margin: 0;
                padding: 10px 8px;
                color: var(--color-text-faint);
                font-size: 0.7rem;
                line-height: 1.45;
            }

            .add-actions {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .add-action {
                display: flex;
                align-items: center;
                gap: 5px;
                width: 100%;
                padding: 5px 6px;
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text);
                text-align: left;
            }

            .add-action:hover {
                background-color: var(--color-bg-hover);
            }

            .add-action--active {
                border-color: var(--color-accent-border);
                background-color: var(--color-accent-soft);
            }

            .add-action__body {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                gap: 1px;
            }

            .add-action__label {
                overflow: hidden;
                font-size: 0.74rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .add-action__hint {
                overflow: hidden;
                color: var(--color-text-faint);
                font-size: 0.62rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .add-action__plus {
                flex: 0 0 auto;
                color: var(--color-text-faint);
            }

            .add-action--active .add-action__plus {
                color: var(--color-accent);
            }

            .config {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }

            .config--pane {
                height: 100%;
            }

            .config__head {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: 6px;
                padding: 6px 8px;
                border-bottom: 1px solid var(--color-border);
            }

            .config__back {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                padding: 0;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-dim);
            }

            .config__back:hover {
                color: var(--color-text);
            }

            .config__title {
                display: flex;
                flex-direction: column;
                min-width: 0;
                gap: 1px;
            }

            .config__title strong {
                overflow: hidden;
                font-size: 0.74rem;
                font-weight: 600;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .config__title span {
                color: var(--color-text-faint);
                font-size: 0.6rem;
            }

            .config__scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 6px 8px;
            }

            .config__fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .config__fields--single {
                grid-template-columns: 1fr;
            }

            .config__fields .field {
                margin-bottom: 0;
            }

            .config__empty {
                margin: 0;
                color: var(--color-text-faint);
                font-size: 0.68rem;
                line-height: 1.45;
            }

            .config__foot {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                justify-content: flex-end;
                gap: var(--space-sm);
                padding: 6px 8px;
                border-top: 1px solid var(--color-border);
            }

            .config__cancel {
                padding: 2px 3px;
                border: none;
                background: transparent;
                color: var(--color-text-faint);
                font-size: 0.68rem;
            }

            .config__cancel:hover {
                color: var(--color-text);
            }

            .add-submit {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 3px;
                padding: 3px 10px;
                border: 1px solid var(--color-accent);
                border-radius: var(--radius-sm);
                background-color: var(--color-accent-soft);
                color: var(--color-text);
                font-size: 0.72rem;
                font-weight: 600;
            }

            .add-submit:hover {
                background-color: color-mix(in srgb, var(--color-accent) 26%, transparent);
            }

            .add-submit:disabled {
                cursor: not-allowed;
                opacity: 0.45;
            }

            .add-stack {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
                width: 100%;
            }

            .add-stack__scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: var(--space-xs);
            }

            .stack-group {
                border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent);
            }

            .stack-group:last-child {
                border-bottom: none;
            }

            .stack-head {
                display: flex;
                align-items: center;
                gap: 5px;
                width: 100%;
                padding: 5px 6px;
                border: none;
                background: transparent;
                color: var(--color-text-dim);
                font-size: 0.72rem;
                text-align: left;
            }

            .stack-head:hover {
                background-color: var(--color-bg-hover);
                color: var(--color-text);
            }

            .stack-head--active {
                color: var(--color-text);
            }

            .stack-head__icon {
                display: inline-flex;
                justify-content: center;
                width: 16px;
                color: var(--color-text-faint);
            }

            .stack-head--active .stack-head__icon {
                color: var(--color-accent);
            }

            .stack-head__label {
                flex: 1;
                text-align: left;
            }

            .stack-head__count {
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.58rem;
            }

            .stack-body {
                padding: 0 var(--space-xs) var(--space-xs) 22px;
            }

            .config--stacked {
