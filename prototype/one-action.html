                flex: 0 0 auto;
                max-height: 196px;
                border-top: 1px solid var(--color-accent-border);
                background-color: var(--color-bg-elevated);
            }

            .drill {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }

            .drill__crumbs {
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: 5px;
                min-width: 0;
                padding: 5px 8px;
                border-bottom: 1px solid var(--color-border);
                color: var(--color-text-faint);
                font-size: 0.66rem;
            }

            .drill__back {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                flex: 0 0 auto;
                padding: 0;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text-dim);
            }

            .drill__back:hover {
                color: var(--color-text);
            }

            .drill__crumb {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                color: var(--color-text-dim);
                white-space: nowrap;
            }

            .drill__sep {
                color: var(--color-disabled);
            }

            .drill__current {
                overflow: hidden;
                color: var(--color-text);
                font-size: 0.68rem;
                font-weight: 600;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .drill__hint {
                margin-left: auto;
                white-space: nowrap;
            }

            .drill__scroll {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: var(--space-xs);
            }

            .drill__menu {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: var(--space-xs);
            }

            .drill-provider {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                padding: 7px 8px;
                border: 1px solid transparent;
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--color-text);
                text-align: left;
            }

            .drill-provider:hover {
                border-color: var(--color-border);
                background-color: var(--color-bg-hover);
            }

            .drill-provider__body {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-width: 0;
                gap: 1px;
            }

            .drill-provider__label {
                font-size: 0.76rem;
            }

            .drill-provider__hint {
                overflow: hidden;
                color: var(--color-text-faint);
                font-size: 0.64rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .drill-provider__count {
                color: var(--color-text-faint);
                font-family: var(--font-mono);
                font-size: 0.62rem;
            }

            .config--drill {
                flex: 1;
                min-height: 0;
            }

            /* ---- Prototype chrome ---------------------------------------- */

            .proto-bar {
                position: fixed;
                bottom: 18px;
                left: 50%;
                z-index: 1000;
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 4px;
                border: 1px solid #4a5362;
                border-radius: var(--radius-full);
                background-color: #0b0d11;
                color: #f2f4f8;
                box-shadow: 0 10px 30px rgb(0 0 0 / 55%);
                transform: translateX(-50%);
                user-select: none;
            }

            .proto-bar__arrow,
            .proto-bar__state {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                height: 28px;
                padding: 0 9px;
                border: none;
                border-radius: var(--radius-full);
                background: transparent;
                color: #b9c1cf;
            }

            .proto-bar__arrow:hover,
            .proto-bar__state:hover {
                background-color: #1e2430;
                color: #fff;
            }

            .proto-bar__label {
                display: flex;
                align-items: baseline;
                gap: 7px;
                min-width: 150px;
                justify-content: center;
                padding: 0 8px;
                font-size: 12px;
                white-space: nowrap;
            }

            .proto-bar__letter {
                color: #a99cff;
                font-family: var(--font-mono);
                font-size: 13px;
                font-weight: 700;
            }

            .proto-bar__name {
                color: #f2f4f8;
            }

            .proto-bar__hint {
                margin-left: 4px;
                color: #6f7989;
                font-family: var(--font-mono);
                font-size: 10px;
            }

            .proto-bar__state {
                border-left: 1px solid #2c3340;
                border-radius: 0 var(--radius-full) var(--radius-full) 0;
                font-size: 11px;
            }

            .state-panel {
                position: fixed;
                bottom: 64px;
                left: calc(var(--sidebar-width) + 20px);
                z-index: 999;
                display: none;
                width: 380px;
                max-height: 300px;
                overflow: auto;
                padding: var(--space-sm);
                border: 1px solid #4a5362;
                border-radius: var(--radius-md);
                background-color: #0b0d11;
                color: #c7cedb;
                box-shadow: var(--shadow-3);
            }

            .state-panel--open {
                display: block;
            }

            .state-panel__title {
                margin: 0 0 var(--space-xs);
                color: #8b94a3;
                font-family: var(--font-mono);
                font-size: 10px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            .state-panel pre {
                margin: 0;
                font-family: var(--font-mono);
                font-size: 10px;
                line-height: 1.5;
                white-space: pre-wrap;
            }

            @media (max-width: 1099px) {
                .app-shell {
                    grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
                }

                .inspector {
                    position: fixed;
                    inset: 0 0 0 auto;
                    z-index: 150;
                    width: var(--inspector-width);
                    box-shadow: var(--shadow-3);
                }
            }
        </style>
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <div class="sidebar__brand">
                    <span class="sidebar__brand-mark" data-icon="zap" data-size="16"></span>
                    <span>LucydDeck</span>
                </div>

                <nav class="sidebar__views" aria-label="Views">
                    <button class="sidebar__view sidebar__view--active" title="Deck">
                        <span data-icon="grid" data-size="18"></span>
                    </button>
                    <button class="sidebar__view" title="Plugins">
                        <span data-icon="plug" data-size="18"></span>
                    </button>
                    <button class="sidebar__view" title="Device">
                        <span data-icon="usb" data-size="18"></span>
                    </button>
                    <button class="sidebar__view" title="Settings">
                        <span data-icon="settings" data-size="18"></span>
                    </button>
                </nav>

                <div class="sidebar__body">
                    <div class="deck-actions">
                        <button class="sidebar-button">
                            <span data-icon="file-plus" data-size="14"></span>
                            <span>New page</span>
                        </button>
                        <button class="sidebar-button sidebar-button--primary">
                            <span data-icon="save" data-size="14"></span>
                            <span>Save</span>
                        </button>
                    </div>

                    <p class="sidebar__section-title">Profile</p>
                    <div class="profile-select">
                        <span>Profile</span>
                        <strong>main</strong>
                        <span data-icon="chevron-down" data-size="14"></span>
                    </div>

                    <p class="sidebar__section-title">Pages</p>
                    <div class="page-list" id="pageList"></div>
                </div>

                <footer class="sidebar__footer">
                    <button class="device-chip" title="Disconnect the deck">
                        <span class="device-chip__dot"></span>
                        <span>Deck connected</span>
                    </button>
                </footer>
            </aside>

            <main class="content">
                <section class="view--board">
                    <header class="board-header">
                        <div class="page-switcher">
                            <button class="page-switcher__pill page-switcher__pill--active">
                                Home
                            </button>
                            <button class="page-switcher__pill">Media</button>
                            <button class="page-switcher__pill">Tools</button>
                            <button class="page-switcher__add" title="New page">
                                <span data-icon="plus" data-size="14"></span>
                            </button>
                        </div>
                    </header>
                    <div class="board-canvas" id="board"></div>
                </section>
            </main>

            <aside class="inspector" id="inspector"></aside>
        </div>

        <script>
            // -----------------------------------------------------------------
            // Icons (inline so the page has no network dependencies).
            // -----------------------------------------------------------------
            const ICON_PATHS = {
                zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',

                sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>',

                power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
                monitor:
                    '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
                video: '<path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
                image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.6-4.6a2 2 0 0 0-2.8 0L3 21"/>',
                bluetooth: '<path d="m7 7 10 10-5 5V2l5 5L7 17"/>',
                mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
                scissors:
                    '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/><path d="M14.47 14.48 20 20"/><path d="M8.12 8.12 12 12"/>',
            };

            function icon(name, size = 16) {
                return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] ?? ICON_PATHS.monitor}</svg>`;
            }

            // Key icons are PNGs in the app, so the prototype's key library is
            // PNG-only too. These are 140x140 transparent files generated from
            // the sample line art.
            const PNG_ICONS = [
                { name: "grid", label: "Home" },
                { name: "play", label: "Play" },
                { name: "copy", label: "Copy" },
                { name: "clipboard", label: "Paste" },
                { name: "volume", label: "Volume" },
                { name: "mic", label: "Microphone" },
                { name: "skip-forward", label: "Next track" },
                { name: "calculator", label: "Calculator" },
                { name: "camera", label: "Camera" },
                { name: "video", label: "Recording" },
                { name: "terminal", label: "Terminal" },
                { name: "sun", label: "Brightness" },
                { name: "mail", label: "Mail" },
                { name: "power", label: "Lock" },
                { name: "monitor", label: "Display" },
                { name: "bluetooth", label: "Bluetooth" },
                { name: "image", label: "Image" },
                { name: "scissors", label: "Scissors" },
                { name: "gamepad", label: "Gamepad" },
            ];

            function iconUrl(name) {
                const custom = state.customIcons.find((item) => item.name === name);
                return custom ? custom.url : name ? `icons/${name}.png` : "";
            }

            function keyIconMarkup(name, size) {
                const url = iconUrl(name);
                if (!url) {
                    return `<span class="key-icon-placeholder">${icon("image", Math.round(size * 0.55))}</span>`;
                }
                return `<img src="${url}" alt="" style="width:${size}px;height:${size}px;object-fit:contain" />`;
            }

            document.querySelectorAll("[data-icon]").forEach((node) => {
                node.outerHTML = icon(node.dataset.icon, Number(node.dataset.size ?? 16));
            });

            // -----------------------------------------------------------------
            // Action catalogue + human descriptions.
            // -----------------------------------------------------------------
            const PAGES = ["Home", "Media", "Tools"];
            const PROFILES = ["main", "work", "gaming"];

            const KEY_NAMES = {
                CTRL: "Ctrl",
                LEFT_CTRL: "Left Ctrl",
                RIGHT_CTRL: "Right Ctrl",
                SHIFT: "Shift",
                LEFT_SHIFT: "Left Shift",
                RIGHT_SHIFT: "Right Shift",
                ALT: "Alt",
                LEFT_ALT: "Left Alt",
                RIGHT_ALT: "Right Alt",
                GUI: "Super",
                LEFT_GUI: "Left Super",
                RIGHT_GUI: "Right Super",
                ESC: "Esc",
                ESCAPE: "Esc",
                RETURN: "Enter",
                ENTER: "Enter",
                BACKSPACE: "Backspace",
                TAB: "Tab",
                SPACE: "Space",
                DELETE: "Delete",
                INSERT: "Insert",
                HOME: "Home",
                END: "End",
                PAGE_UP: "Page Up",
                PAGE_DOWN: "Page Down",
                UP_ARROW: "↑",
                DOWN_ARROW: "↓",
                LEFT_ARROW: "←",
                RIGHT_ARROW: "→",
                MINUS: "−",
                EQUALS: "=",
                LEFT_BRACKET: "[",
                RIGHT_BRACKET: "]",
                BACKSLASH: "\\",
                SEMICOLON: ";",
                QUOTE: "'",
                GRAVE: "`",
                COMMA: ",",
                PERIOD: ".",
                SLASH: "/",
                PRINT_SCREEN: "Print Screen",
                CAPS_LOCK: "Caps Lock",
                NUM_LOCK: "Num Lock",
            };

            const CONTROL_LABELS = {
                VOLUME_UP: "Volume up",
                VOLUME_DOWN: "Volume down",
                MUTE: "Mute",
                PLAY_PAUSE: "Play / pause",
                NEXT_TRACK: "Next track",
                PREV_TRACK: "Previous track",
                STOP: "Stop media",
                BRIGHTNESS_UP: "Brightness up",
                BRIGHTNESS_DOWN: "Brightness down",
                SLEEP: "Sleep",
                WAKE: "Wake",
                POWER: "Power",
                CALCULATOR: "Calculator",
                MAIL: "Mail",
                WWW_HOME: "Browser home",
                WWW_SEARCH: "Browser search",
                WWW_BACK: "Browser back",
                WWW_FORWARD: "Browser forward",
                SCREENSHOT: "Screenshot",
                RECORD: "Record",
                RESET: "Reset",
                NEXT_PAGE: "Next page",
                PREV_PAGE: "Previous page",
                TOGGLE_PROFILE: "Toggle profile",
            };

            const HID_KEYS = new Set([
                ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
                ..."0123456789".split(""),
                ...Array.from({ length: 24 }, (_, index) => `F${index + 1}`),
                ...Object.keys(KEY_NAMES),
                ...Array.from({ length: 10 }, (_, index) => `KP_${index}`),
                "KP_DOT",
                "KP_ENTER",
                "KP_PLUS",
                "KP_MINUS",
                "KP_MULTIPLY",
                "KP_DIVIDE",
                "PAUSE",
                "SCROLL_LOCK",
                "APPLICATION",
                "MENU",
                "PGUP",
                "PGDN",
                "DEL",
                "INS",
            ]);

            const CONTROL_KEY_SET = new Set(Object.keys(CONTROL_LABELS));

            function invalidReason(namespace, args) {
                if (namespace === "PAGE") {
                    return /^\d+$/.test(args) ? null : "A page step needs a page number.";
                }
                if (namespace === "PROFILE") {
                    return args.trim() === "" ? "A profile step needs a profile name." : null;
                }
                if (namespace === "HID_KEY") {
                    const keys = args.split("+");
                    if (keys.some((key) => key === "")) {
                        return "A key combination cannot contain an empty key.";
                    }
                    const unknown = keys.find((key) => !HID_KEYS.has(key));
                    return unknown === undefined ? null : `Unknown key “${unknown}”.`;
                }
                if (namespace === "CONTROL_KEY") {
                    return CONTROL_KEY_SET.has(args) ? null : `Unknown control key “${args}”.`;
                }
                if (namespace === "MOUSE_MOVE") {
                    return /^-?\d+,-?\d+(,-?\d+)?$/.test(args)
                        ? null
                        : "A cursor move needs x,y coordinates.";
                }
                if (namespace === "MOUSE_CLICK") {
                    const [button, count] = args.split(",");
                    if (!["LEFT", "RIGHT", "MIDDLE"].includes(button)) {
                        return "Choose a mouse button.";
                    }
                    if (
                        count !== undefined &&
                        (!/^\d+$/.test(count) || +count < 1 || +count > 10)
                    ) {
                        return "Click count must be between 1 and 10.";
                    }
                    return null;
                }
                if (namespace === "DELAY") {
                    return /^\d+$/.test(args) ? null : "A wait step needs milliseconds.";
                }
                if (namespace === "CMD") {
                    return args.trim() === "" ? "A command step needs a command." : null;
                }
                if (namespace === "TEXT") {
                    return null;
                }
                return `Unknown action type “${namespace}”.`;
            }

            function categoryForNamespace(namespace) {
                if (namespace === "PAGE" || namespace === "PROFILE") {
                    return "deck";
                }
                if (namespace === "HID_KEY" || namespace === "CONTROL_KEY") {
                    return "keyboard";
                }
                if (namespace === "MOUSE_MOVE" || namespace === "MOUSE_CLICK") {
                    return "mouse";
                }
                if (namespace === "TEXT") {
                    return "text";
                }
                if (namespace === "DELAY") {
                    return "timing";
                }
                return "commands";
            }

            const CATEGORIES = [
                { id: "deck", label: "Deck", icon: "grid" },
                { id: "keyboard", label: "Keyboard", icon: "keyboard" },
                { id: "mouse", label: "Mouse", icon: "mouse" },
                { id: "text", label: "Text", icon: "type" },
                { id: "timing", label: "Timing", icon: "clock" },
                { id: "commands", label: "Commands", icon: "terminal" },
                { id: "plugins", label: "Plugins", icon: "gamepad" },
            ];

            const numberField = (key, label, value) => ({
                key,
                label,
                kind: "number",
                value,
            });

            const ACTIONS = [
                {
                    id: "PAGE",
                    cat: "deck",
                    label: "Switch page",
                    hint: "Jump to another page",
                    fields: [
                        {
                            key: "id",
                            label: "Page",
                            kind: "select",
                            options: PAGES.map((name, index) => ({
                                value: String(index),
                                label: `${name} (page ${index + 1})`,

                            value: "1",
                        },
                    ],
                    build: (values) => `PAGE:${values.id ?? "0"}`,
                },
                {
                    id: "PROFILE",
                    cat: "deck",
                    label: "Switch profile",
                    hint: "Activate a profile",
                    fields: [
                        {
                            key: "name",
                            label: "Profile",
                            kind: "select",
                            options: PROFILES.map((name) => ({ value: name, label: name })),
                            value: "main",
                        },
                    ],
                    build: (values) => `PROFILE:${values.name ?? ""}`,
                },
                {
                    id: "HID_KEY",
                    cat: "keyboard",
                    label: "Keyboard shortcut",
                    hint: "Press a key or key combination",
                    fields: [
                        {
                            key: "keys",
                            label: "Keys",
                            kind: "text",
                            value: "CTRL+C",
                            placeholder: "CTRL+C",
                            hint: "Use + between keys",
                            wide: true,
                        },
                    ],
                    build: (values) => `HID_KEY:${(values.keys ?? "").trim().toUpperCase()}`,
                },
                {
                    id: "CONTROL_KEY",
                    cat: "keyboard",
                    label: "Control key",
                    hint: "Media and system keys",
                    fields: [
                        {
                            key: "name",
                            label: "Control",
                            kind: "select",
                            options: Object.entries(CONTROL_LABELS).map(([value, label]) => ({
                                value,
                                label,
                            })),
                            value: "VOLUME_UP",
                        },
                    ],
                    build: (values) => `CONTROL_KEY:${values.name ?? ""}`,
                },
                {
                    id: "MOUSE_MOVE",
                    cat: "mouse",
                    label: "Move cursor",
                    hint: "Move the pointer by an offset",
                    fields: [
                        numberField("x", "X", "40"),
                        numberField("y", "Y", "-12"),
                        { ...numberField("wheel", "Wheel", ""), optional: true },
                    ],
                    build: (values) =>
                        `MOUSE_MOVE:${values.x ?? "0"},${values.y ?? "0"}${values.wheel ? `,${values.wheel}` : ""}`,
                },
                {
                    id: "MOUSE_CLICK",
                    cat: "mouse",
                    label: "Mouse click",
                    hint: "Click a mouse button",
                    fields: [
                        {
                            key: "button",
                            label: "Button",
                            kind: "select",
                            options: ["LEFT", "RIGHT", "MIDDLE"].map((value) => ({
                                value,
                                label: value.toLowerCase(),
                            })),
                            value: "LEFT",
                        },
                        { ...numberField("count", "Count", "1"), optional: true },
                    ],
                    build: (values) =>
                        `MOUSE_CLICK:${values.button ?? "LEFT"}${values.count && values.count !== "1" ? `,${values.count}` : ""}`,
                },
                {
                    id: "TEXT",
                    cat: "text",
                    label: "Type text",
                    hint: "Type a string of text",

            const PROVIDERS = [
                { id: "deck", label: "Deck", icon: "grid" },
                { id: "system", label: "System", icon: "settings" },
                { id: "discord", label: "Discord", icon: "gamepad" },
                { id: "obs", label: "OBS", icon: "video" },
                { id: "spotify", label: "Spotify", icon: "play" },
                { id: "other", label: "Other plugins", icon: "plug" },
            ];

            function providerOfAction(action) {
                if (action.cat === "deck") {
                    return "deck";
                }
                if (action.cat !== "plugins") {
                    return "system";
                }
                if (action.id.includes("OBS")) {
                    return "obs";
                }
                if (action.id.includes("DISCORD")) {
                    return "discord";
                }
                if (action.id.includes("SPOTIFY")) {
                    return "spotify";
                }
                return "other";
            }

            function actionsFor(provider) {
                return ACTIONS.filter((action) => providerOfAction(action) === provider);
            }

            function providerForAction(actionId) {
                const action = ACTIONS.find((item) => item.id === actionId);
                return action ? providerOfAction(action) : "deck";
            }

            function categoryOf(id) {
                return CATEGORIES.find((cat) => cat.id === id) ?? CATEGORIES[0];
            }

            function prettyKey(name) {
                if (KEY_NAMES[name]) {
                    return KEY_NAMES[name];
                }
                if (/^F\d+$/.test(name)) {
                    return name;
                }
                return name
                    .toLowerCase()
                    .replace(/_/g, " ")
                    .replace(/^\w/, (letter) => letter.toUpperCase());
            }

            function truncate(value, length) {
                return value.length > length ? `${value.slice(0, length - 1)}…` : value;
            }

            /**
             * Turn a wire action into the label and detail the panel shows.
             * Everything user-facing goes through here so no raw HID_KEY:…
             * string ever reaches the sequence list.
             */
            function describe(raw) {
                const separator = raw.indexOf(":");
                if (separator <= 0) {
                    return {
                        cat: "commands",
                        icon: "alert-triangle",
                        label: "Invalid step",
                        detail: raw || "Empty step",
                        invalid: 'Expected "namespace:args"',
                    };
                }
                const namespace = raw.slice(0, separator);
                const args = raw.slice(separator + 1);
                const invalid = invalidReason(namespace, args);
                if (invalid !== null) {
                    return {
                        cat: categoryForNamespace(namespace),
                        icon: "alert-triangle",
                        label: "Invalid step",
                        detail: invalid,
                        invalid,
                    };
                }

                if (namespace === "PAGE") {
                    const index = Number(args);
                    const name = PAGES[index] ?? `Page ${index + 1}`;
                    return {
                        cat: "deck",
                        icon: "grid",
                        label: `Switch to ${name}`,
                        detail: `Page ${Number.isFinite(index) ? index + 1 : "?"}`,
                    };
                }
                if (namespace === "PROFILE") {
                    return {
                        cat: "deck",
                        icon: "grid",
                        label: `Switch to profile ${args}`,
                        detail: "Deck profile",
                    };
                }
                if (namespace === "HID_KEY") {
                    const keys = args.split("+").filter(Boolean).map(prettyKey);
                    return {
                        cat: "keyboard",
                        icon: "keyboard",
                        label: `Press ${keys.join(" + ")}`,
                        detail: "Keyboard shortcut",
                    };
                }
                if (namespace === "CONTROL_KEY") {
                    const label = CONTROL_LABELS[args] ?? prettyKey(args);
                    return {
                        cat: "keyboard",
                        icon: "volume",
                        label,
                        detail: "Control key",
                    };
                }
                if (namespace === "MOUSE_MOVE") {
                    const [x, y, wheel] = args.split(",");
                    return {
                        cat: "mouse",
                        icon: "mouse-pointer",
                        label: "Move cursor",
                        detail: `to ${x}, ${y}${wheel ? ` · wheel ${wheel}` : ""}`,
                    };
                }
                if (namespace === "MOUSE_CLICK") {
                    const [button, count] = args.split(",");
                    const clicks = Number(count ?? "1");
                    return {
                        cat: "mouse",
                        icon: "mouse",
                        label:
                            clicks === 2
                                ? "Double-click"
                                : clicks > 2
                                  ? `Click ${clicks}×`
                                  : "Click",
                        detail: `${prettyKey((button ?? "LEFT").toUpperCase())} button`,
                    };
                }
                if (namespace === "DELAY") {
                    return {
                        cat: "timing",
                        icon: "clock",
                        label: `Wait ${args} ms`,
                        detail: "Pause the sequence",
                    };
                }
                if (namespace === "TEXT") {
                    return {
                        cat: "text",
                        icon: "type",
                        label: `Type “${truncate(args || "…", 34)}”`,
                        detail: "Text",
                    };
                }
                if (namespace === "CMD") {
                    const inner = args.indexOf(":");
                    if (inner > 0) {
                        const handle = args.slice(0, inner);
                        const command = args.slice(inner + 1).replace(/_/g, " ");
                        return {
                            cat: "plugins",
                            icon: "gamepad",
                            label: `Run ${handle} · ${command}`,
                            detail: "Plugin command",
                        };
                    }
                    return {
                        cat: "commands",
                        icon: "terminal",
                        label: "Run command",
                        detail: args,
                    };
                }
                return {
                    cat: "commands",
                    icon: "alert-triangle",
                    label: "Invalid step",
                    detail: raw,
                    invalid: `Unknown action namespace "${namespace}"`,
                };
            }

            function fieldValuesFor(raw) {
                const separator = raw.indexOf(":");
                if (separator <= 0) {
                    return null;
                }
                const namespace = raw.slice(0, separator);
                const args = raw.slice(separator + 1);
                if (invalidReason(namespace, args) !== null) {
                    return null;
                }
                const type = ACTIONS.find((action) => action.id === namespace);
                if (!type) {
                    return null;
                }
                if (type.raw) {
                    return {};
                }
                const values = defaultValues(type);
                if (namespace === "PAGE" || namespace === "PROFILE") {
                    values[type.fields[0].key] = args;
                } else if (namespace === "HID_KEY" || namespace === "CONTROL_KEY") {
                    values[type.fields[0].key] = args;
                } else if (namespace === "TEXT") {
                    values.text = args;
                } else if (namespace === "CMD") {
                    values.command = args;
                } else if (namespace === "DELAY") {
                    values.ms = args;
                } else if (namespace === "MOUSE_MOVE") {
                    const [x, y, wheel] = args.split(",");
                    values.x = x ?? "0";
                    values.y = y ?? "0";
                    values.wheel = wheel ?? "";
                } else if (namespace === "MOUSE_CLICK") {
                    const [button, count] = args.split(",");
                    values.button = button ?? "LEFT";
                    values.count = count ?? "1";
                }
                return { type, values };
            }

            function defaultValues(type) {
                const values = {};
                for (const field of type.fields) {
                    values[field.key] = field.value ?? "";
                }
                return values;
            }

            function buildRaw(type, values) {

                                    .join("")}

                        } else if (field.kind === "textarea") {
                            control = `<textarea class="input" rows="2" data-role="${role}" data-step="${index}" data-key="${field.key}" placeholder="${escapeHtml(field.placeholder ?? "")}">${escapeHtml(value)}</textarea>`;
                        } else {
                            control = `<input class="input" type="${field.kind === "number" ? "number" : "text"}" value="${valueAttr}" data-role="${role}" data-step="${index}" data-key="${field.key}" placeholder="${escapeHtml(field.placeholder ?? "")}" />`;
